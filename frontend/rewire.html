<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ReWire</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <style>
      :root { --ink:#1a1815; --muted:#6b6458; --soft:#f2f2f4; --blue:#0a84ff; --violet:#5b4af0; --violet-deep:#4a3cd9; --jolt:#ffd86b; --jolt-deep:#ffb300; --jolt-ink:#241700; }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body,#root { height:100%; width:100%; overflow:hidden; }
      body { background:#fff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; user-select:none; color:var(--ink); }
      button,input,textarea { font:inherit; } button { border:0; background:none; color:inherit; cursor:pointer; }
      input,textarea { border:0; outline:0; color:inherit; background:transparent; }
      textarea::placeholder,input::placeholder { color:rgba(0,0,0,0.25); }
      canvas { display:block; }
      .accent { color:var(--blue); } .mono { font-family:"SF Mono",ui-monospace,Menlo,monospace; }
      .copy { margin:0; color:var(--muted); font-size:15px; line-height:1.45; font-weight:500; }
      .eyebrow { color:#80786c; font-size:13px; font-weight:800; letter-spacing:0.24em; }
      .btn-primary { width:100%; min-height:58px; padding:0 28px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; background:var(--ink); color:#fff; border:none; cursor:pointer; transition:transform 160ms ease; }
      .btn-primary:active { transform:scale(0.98); } .btn-primary:disabled { background:rgba(0,0,0,0.08); color:rgba(0,0,0,0.3); }
      .btn-secondary { width:100%; min-height:58px; padding:0 28px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; background:#fff; color:var(--ink); border:1px solid rgba(0,0,0,0.12); cursor:pointer; }
      .pill-btn { min-height:44px; padding:0 16px; border-radius:999px; background:var(--soft); color:var(--ink); font-size:13px; font-weight:600; border:none; cursor:pointer; }
      .back-btn { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--ink); font-size:22px; background:none; border:none; cursor:pointer; }
      .topbar { min-height:44px; display:flex; align-items:center; justify-content:space-between; }
      .splash-bg { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px 40px; text-align:center; background:linear-gradient(180deg,rgba(255,255,255,0) 42%,rgba(255,255,255,0.88) 100%),conic-gradient(from 90deg at 50% 48%,#b6c4ee,#8aa1d6,#e8d8ce,#c8b4d4,#b6c4ee); }
      .splash-logo { width:220px; height:220px; object-fit:contain; margin-bottom:24px; mix-blend-mode:multiply; }
      .splash-actions { width:100%; margin-top:auto; display:grid; gap:10px; padding:0 24px; }
      .onboard-wrap { height:100%; display:flex; flex-direction:column; padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px)); }
      .onboard-preview { flex:1; display:grid; place-items:center; padding:10px 0; min-height:0; overflow:hidden; }
      .onboard-copy { text-align:center; display:grid; gap:13px; padding:16px 0 20px; flex-shrink:0; }
      .onboard-copy h1 { margin:0; font-size:34px; line-height:1.05; font-weight:700; }
      .onboard-copy .copy { max-width:340px; margin:0 auto; font-size:15px; line-height:1.4; }
      .dark-jolt-card { position:relative; width:220px; min-height:220px; border-radius:30px; padding:20px; overflow:hidden; color:#fff; background:radial-gradient(circle at 50% 43%,rgba(150,133,255,0.54),transparent 26%),radial-gradient(circle at 25% 70%,rgba(10,132,255,0.26),transparent 38%),linear-gradient(160deg,#211c46 0%,#0b081b 54%,#05030d 100%); box-shadow:0 24px 50px rgba(20,17,42,0.28); display:flex; flex-direction:column; }
      .jolt-chip { display:inline-flex; align-items:center; min-height:26px; padding:0 9px; border-radius:999px; background:var(--jolt); color:var(--jolt-ink); font-size:10px; font-weight:800; }
      .bars { height:80px; display:flex; justify-content:center; align-items:center; gap:5px; margin:28px 0 20px; }
      .bars span { width:5px; border-radius:999px; background:linear-gradient(180deg,var(--jolt),#8fb8ff); transform-origin:center; animation:barPulse 1100ms ease-in-out infinite; }
      .bars span:nth-child(1){height:22px;animation-delay:0ms} .bars span:nth-child(2){height:48px;animation-delay:80ms} .bars span:nth-child(3){height:70px;animation-delay:160ms} .bars span:nth-child(4){height:40px;animation-delay:240ms} .bars span:nth-child(5){height:60px;animation-delay:320ms} .bars span:nth-child(6){height:28px;animation-delay:400ms}
      .mini-stack { position:relative; width:220px; height:260px; }
      .mini-note { position:absolute; left:18px; right:18px; top:24px; aspect-ratio:1/1; border-radius:20px; padding:16px; background:var(--violet); color:#fff; box-shadow:0 14px 30px rgba(91,74,240,0.22); }
      .mini-note:nth-child(1){z-index:3} .mini-note:nth-child(2){z-index:2;top:48px;transform:scale(0.94) rotate(2deg);background:var(--violet-deep)} .mini-note:nth-child(3){z-index:1;top:72px;transform:scale(0.88) rotate(-1.5deg);background:#3d32bd}
      .mini-note.jolted { background:linear-gradient(145deg,var(--jolt) 0%,var(--jolt-deep) 100%); color:var(--jolt-ink); }
      .note-meta { font-size:10px; letter-spacing:0.08em; opacity:0.72; margin-bottom:10px; text-transform:uppercase; }
      .mini-note p { margin:0; font-size:13px; line-height:1.36; font-weight:520; }
      .mini-plus { position:absolute; z-index:4; left:50%; bottom:4px; width:48px; height:48px; transform:translateX(-50%); border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:32px; font-weight:250; }
      .q-wrap { height:100%; display:flex; flex-direction:column; padding:16px 24px 0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
      .q-title { padding:28px 0 0; font-size:26px; line-height:1.2; font-weight:650; }
      .q-sub { margin-top:10px; color:#7a7a85; font-size:14px; line-height:1.4; }
      .composer { display:flex; gap:10px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); position:sticky; bottom:0; background:#fff; z-index:10; }
      .composer-box { width:100%; border-radius:24px; background:var(--soft); padding:10px; }
      .composer-pill { display:flex; align-items:center; gap:8px; min-height:46px; border-radius:22px; background:#fff; padding:6px 6px 6px 16px; }
      .composer-pill input { flex:1; min-width:0; height:34px; font-size:17px; }
      .send-btn { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:#cfcfd6; color:#fff; font-size:15px; font-weight:800; border:none; cursor:pointer; flex-shrink:0; }
      .send-btn.ready { background:var(--blue); }
      .breathing-screen { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; background:#fff; }
      .breath-box-wrap { position:relative; width:200px; height:200px; margin-bottom:30px; }
      .breath-box { width:100%; height:100%; border:1.5px solid rgba(0,0,0,0.1); border-radius:8px; display:grid; place-items:center; }
      .breath-countdown { font-size:52px; font-weight:200; color:var(--ink); }
      .breath-dot { position:absolute; width:12px; height:12px; border-radius:50%; background:var(--ink); box-shadow:0 0 12px rgba(0,0,0,0.15); transition:left 0.1s linear,top 0.1s linear; }
      .breath-phase-label { position:absolute; font-size:12px; font-weight:500; letter-spacing:0.06em; transition:color 0.3s; }
      .breath-phase-label.top { top:-22px; left:50%; transform:translateX(-50%); }
      .breath-phase-label.right { right:-58px; top:50%; transform:translateY(-50%); }
      .breath-phase-label.bottom { bottom:-22px; left:50%; transform:translateX(-50%); }
      .breath-phase-label.left { left:-44px; top:50%; transform:translateY(-50%); }
      .breath-phase-label.active { color:var(--ink); font-weight:700; }
      .breath-phase-label:not(.active) { color:rgba(0,0,0,0.2); }
      .breath-cycle { font-size:13px; color:var(--muted); margin-bottom:24px; }
      .breath-progress { width:200px; height:3px; background:rgba(0,0,0,0.06); border-radius:2px; overflow:hidden; margin-bottom:12px; }
      .breath-progress-fill { height:100%; background:rgba(0,0,0,0.15); transition:width 0.1s linear; }
      .gen-progress { width:200px; margin-bottom:8px; }
      .gen-bar { width:100%; height:3px; background:rgba(0,0,0,0.04); border-radius:2px; overflow:hidden; margin-bottom:6px; }
      .gen-fill { height:100%; background:var(--jolt); border-radius:2px; transition:width 0.8s ease; }
      .gen-label { font-size:11px; color:var(--muted); text-align:center; }
      .skip-btn { background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:12px; margin-top:12px; min-height:44px; }
      .demo-form { display:flex; flex-direction:column; gap:14px; text-align:left; width:100%; max-width:420px; margin-top:20px; }
      .demo-form label { font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:0.05em; text-transform:uppercase; display:block; }
      .demo-form select { width:100%; padding:12px 14px; background:#f4f4f6; border:1px solid rgba(0,0,0,0.1); border-radius:12px; font-size:15px; font-family:inherit; color:var(--ink); outline:none; appearance:none; cursor:pointer; }
      .wait-screen { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
      .wait-progress { width:100%; max-width:420px; margin-bottom:24px; }
      .wait-bar { width:100%; height:4px; background:rgba(0,0,0,0.06); border-radius:2px; overflow:hidden; margin-bottom:10px; }
      .wait-fill { height:100%; background:var(--ink); border-radius:2px; transition:width 0.8s ease; }
      .ready-icon { width:64px; height:64px; border-radius:50%; background:linear-gradient(145deg,rgba(91,74,240,0.2),rgba(255,216,107,0.15)); border:1px solid rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:28px; }
      .survey-wrap { height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:40px 20px 220px; }
      .survey-inner { max-width:560px; margin:0 auto; }
      .survey-card { border-radius:20px; padding:16px; background:#fff; border:1px solid rgba(0,0,0,0.06); box-shadow:0 12px 30px rgba(26,24,21,0.06); margin-bottom:16px; }
      .survey-card h3 { margin:0 0 10px; font-size:16px; font-weight:600; }
      .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .choice-btn { min-height:48px; border-radius:16px; background:#f1f1f3; color:var(--ink); font-size:15px; font-weight:620; border:none; cursor:pointer; }
      .choice-btn.sel { background:var(--ink); color:#fff; }
      .pill-choice { padding:10px 14px; min-height:44px; border-radius:18px; background:rgba(0,0,0,0.03); border:1px solid rgba(0,0,0,0.06); font-size:13.5px; font-weight:550; cursor:pointer; color:var(--ink); display:inline-flex; align-items:center; }
      .pill-choice.sel { background:var(--ink); color:#fff; border-color:var(--ink); }
      .intensity-row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
      .intensity-btn { min-height:48px; border-radius:50%; background:#f4f4f5; color:#9a958c; font-size:15px; font-weight:720; border:none; cursor:pointer; }
      .intensity-btn.sel { background:var(--jolt); color:var(--jolt-ink); }
      .range-labels { display:flex; justify-content:space-between; margin-top:7px; color:#b0aaa0; font-size:12px; font-weight:650; }
      .likert-row { display:flex; justify-content:space-between; align-items:center; gap:3px; }
      .likert-btn { width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,0.03); color:var(--ink); border:1px solid rgba(0,0,0,0.1); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0; }
      .likert-btn.sel { background:var(--ink); color:#fff; border:none; }
      .survey-textarea { width:100%; padding:12px; background:rgba(0,0,0,0.02); border:1px solid rgba(0,0,0,0.06); border-radius:12px; color:var(--ink); font-size:14px; font-family:inherit; resize:none; outline:none; line-height:1.6; }
      .survey-input { width:100%; padding:12px; background:rgba(0,0,0,0.02); border:1px solid rgba(0,0,0,0.06); border-radius:12px; color:var(--ink); font-size:14px; font-family:inherit; outline:none; }
      .survey-footer { position:fixed; left:0; right:0; bottom:0; padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(255,255,255,0),#fff 38%); z-index:30; }
      .survey-footer .btn-primary { max-width:560px; margin:0 auto; }
      .stack-bg { height:100%; background:#fbfaf7; }
      .stack-wrap { height:100%; display:flex; flex-direction:column; padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px)); }
      .stack-scene { position:relative; flex:1; min-height:200px; overflow:hidden; display:flex; flex-direction:column; }
      .note-card { position:relative; width:100%; flex:1; min-height:280px; border-radius:22px; background:var(--violet); color:#fff; box-shadow:0 18px 36px rgba(91,74,240,0.22); padding:18px 18px 20px; display:flex; flex-direction:column; }
      .note-card.jolted { background:linear-gradient(145deg,var(--jolt) 0%,var(--jolt-deep) 100%); color:var(--jolt-ink); box-shadow:0 18px 36px rgba(255,179,0,0.24); }
      .note-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
      .note-body { flex:1; min-height:0; margin-top:14px; overflow:hidden; }
      .note-card p { margin:0; font-size:17px; line-height:1.4; font-weight:520; white-space:pre-wrap; }
      .note-card textarea { width:100%; height:100%; min-height:200px; resize:none; padding:0; color:inherit; font-size:17px; line-height:1.4; caret-color:var(--jolt); background:transparent; border:none; outline:none; }
      .note-card textarea::placeholder { color:currentColor; opacity:0.5; }
      .jolt-note-btn { display:flex; align-items:center; gap:5px; min-height:30px; padding:0 10px; border-radius:999px; background:rgba(255,255,255,0.16); color:var(--jolt); font-size:11px; font-weight:800; letter-spacing:0.08em; border:none; cursor:pointer; animation:joltButtonPulse 2200ms ease-in-out infinite; }
      .jolt-note-btn.is-jolted { animation:none; background:rgba(255,255,255,0.36); }
      .jolted .jolt-note-btn { color:var(--jolt-ink); }
      .nav-btn { width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:22px; font-weight:600; border:none; cursor:pointer; }
      .plus-wrap { display:grid; justify-items:center; gap:6px; padding:8px 0; }
      .plus-button { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:#fff; font-size:36px; font-weight:250; box-shadow:0 14px 28px rgba(26,24,21,0.18); border:none; cursor:pointer; }
      .plus-label { color:var(--muted); font-size:12px; font-weight:650; }
      .done-wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
      .done-actions { width:100%; display:grid; gap:10px; margin-top:8px; }
      .fade-enter { opacity:0; transform:translateY(14px); transition:opacity 0.5s,transform 0.5s; }
      .fade-visible { opacity:1; transform:none; }
      input[type="range"] { -webkit-appearance:none; width:100%; height:4px; background:rgba(0,0,0,0.1); border-radius:2px; outline:none; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--ink); cursor:pointer; }
      @keyframes barPulse{0%,100%{transform:scaleY(.52);opacity:.62}50%{transform:scaleY(1);opacity:1}}
      @keyframes joltButtonPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,107,.22);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(255,216,107,.14),0 0 24px rgba(255,216,107,.22);transform:scale(1.035)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {useState,useEffect,useRef,useCallback}=React;
      const API_BASE=window.location.hostname==="localhost"?"http://localhost:8000":"";
      function tryFullscreen(){try{const el=document.documentElement;const rfs=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(rfs)rfs.call(el)}catch(e){}}
      const QUESTIONS=[
        {id:"wound",title:'What does the voice in your head say when you\u2019re at your <span class="accent">lowest</span>?',placeholder:"Write what it says..."},
        {id:"lastChills",title:'When was the last time you got <span class="accent">chills or goosebumps</span>?',placeholder:"Type the moment...",instruction:"Tell us the context, what it means for you, and why you got goosebumps."},
        {id:"hiddenTruth",title:'What\u2019s something true about you that <span class="accent">nobody sees</span>?',placeholder:"The version of you no one sees...",instruction:"The version of you that exists when no one\u2019s watching."},
        {id:"firstTell",title:'If something amazing happened to you today, who would be the <span class="accent">first person</span> you\u2019d tell?',placeholder:"Type a name or relationship..."},
      ];
      const ONBOARDING=[{id:"daily",title:"Your daily Jolt.",body:"A 3-minute booster made to give you chills and lift you up."},{id:"capture",title:"Catch the insight.",body:"Each Jolt brings up something new. Save it on a sticky and your next Jolt gets deeper."},{id:"noteJolt",title:"Go deep.",body:"Tap any note to turn it into a new Jolt. Discover new parts of yourself and leave the rest behind."}];
      const STAGE_LABELS={queued:"Starting\u2026",writing:"Writing your experience\u2026",synthesizing:"Creating the voice\u2026",refining:"Fine-tuning\u2026",mixing:"Mixing with music\u2026",saving:"Almost there\u2026"};
      function Bars(){return<div className="bars"><span/><span/><span/><span/><span/><span/></div>;}
      function FadeIn({children,delay=0,style={}}){const[v,setV]=useState(false);useEffect(()=>{const t=setTimeout(()=>setV(true),delay);return()=>clearTimeout(t);},[delay]);return<div className={v?"fade-visible":"fade-enter"} style={style}>{children}</div>;}

      function Splash({onStart}){return(<div className="splash-bg"><FadeIn delay={200}><div style={{fontSize:12,fontWeight:600,letterSpacing:".15em",textTransform:"uppercase",color:"rgba(0,0,0,0.35)",marginBottom:40}}>REWIRE</div></FadeIn><FadeIn delay={500}><img className="splash-logo" src="/assets/jolter-logo.jpeg" alt="Jolter"/></FadeIn><FadeIn delay={800}><p className="copy" style={{maxWidth:340,textAlign:"center",marginBottom:40,fontSize:16.5}}>A 3-minute experience made to give you chills and connect you back to yourself.</p></FadeIn><FadeIn delay={1200}><div className="splash-actions"><button className="btn-primary" onClick={()=>{tryFullscreen();onStart();}}>Start</button></div></FadeIn></div>);}

      function OnboardingScreen({step,onNext,onSkip}){
        const item=ONBOARDING[step];
        const preview=item.id==="daily"?(<div className="dark-jolt-card"><div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}><div className="mono" style={{fontSize:10,color:"rgba(255,255,255,.58)",letterSpacing:".08em"}}>DAILY JOLT</div><span className="jolt-chip">JOLT</span></div><Bars/></div>):(<div className="mini-stack"><div className={`mini-note ${item.id==="noteJolt"?"jolted":""}`}><div className="note-meta mono">APR 25 - 2:16 PM</div><p>{item.id==="noteJolt"?"What stood out most was when he said he wanted to live instead of just surviving.":"The song brought back a feeling I wanted to keep."}</p></div><div className="mini-note"><div className="note-meta mono"/><p/></div><div className="mini-note"><div className="note-meta mono"/><p/></div>{item.id!=="noteJolt"&&<div className="mini-plus">+</div>}</div>);
        return(<div className="onboard-wrap"><div className="topbar"><button className="back-btn" onClick={()=>step>0?onSkip("back"):onSkip("splash")}>{step>0?"\u2039":""}</button><button className="pill-btn" onClick={()=>onSkip("skip")}>Skip</button></div><div className="onboard-preview">{preview}</div><div className="onboard-copy"><h1>{item.title}</h1><p className="copy">{item.body}</p></div><button className="btn-primary" style={{flexShrink:0}} onClick={onNext}>{step===ONBOARDING.length-1?"Continue":"Next"}</button></div>);
      }

      function ChillsQuestions({onNext}){
        const[qi,setQi]=useState(0);const[ans,setAns]=useState({});const[draft,setDraft]=useState("");const c=QUESTIONS[qi];const hasVal=draft.trim().length>0;
        const advance=()=>{if(!draft.trim())return;const u={...ans,[c.id]:draft.trim()};setAns(u);if(qi<QUESTIONS.length-1){setQi(qi+1);setDraft(u[QUESTIONS[qi+1]?.id]||"");}else onNext(u);};

      function BreathingAndGenerating({answers,onReady}){
        const PM=4000,TC=15,phases=["Breathe In","Hold","Breathe Out","Hold"];
        const[pi,setPi]=useState(0);const[cd,setCd]=useState(4);const[cy,setCy]=useState(1);const[done,setDone]=useState(false);const[skip,setSkip]=useState(false);const[prog,setProg]=useState(0);
        const[sid,setSid]=useState(null);const[aUrl,setAUrl]=useState(null);const[aReady,setAReady]=useState(false);const[err,setErr]=useState(null);const[gStage,setGStage]=useState("queued");const[gProg,setGProg]=useState(0);

        useEffect(()=>{const st=Date.now(),tot=TC*4*PM;const iv=setInterval(()=>{const el=Date.now()-st,tp=Math.floor(el/PM),cc=Math.floor(tp/4)+1,cp=tp%4,rm=Math.ceil((PM-(el%PM))/1000);if(cc>TC){setDone(true);clearInterval(iv);return;}setPi(cp);setCd(Math.max(1,rm));setCy(cc);setProg(el/tot);if(cc>=3)setSkip(true);},100);return()=>clearInterval(iv);},[]);
        const saveDem=()=>{if(!sid)return;fetch(API_BASE+"/api/demo/demographics",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,age,gender,ethnicity:eth})}).catch(()=>{});};
        const go=()=>{saveDem();onReady({sessionId:sid,audioUrl:aUrl});};
        const demoForm=(<div className="demo-form"><div><label>Age range</label><select value={age} onChange={e=>setAge(e.target.value)}><option value="">Select</option><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-44">35-44</option><option value="45-54">45-54</option><option value="55-64">55-64</option><option value="65+">65+</option></select></div><div><label>Gender</label><select value={gender} onChange={e=>setGender(e.target.value)}><option value="">Select</option><option value="male">Male</option><option value="female">Female</option><option value="non-binary">Non-binary</option><option value="prefer-not">Prefer not to say</option></select></div><div><label>Ethnicity</label><select value={eth} onChange={e=>setEth(e.target.value)}><option value="">Select</option><option value="white">White</option><option value="black">Black / African American</option><option value="hispanic">Hispanic / Latino</option><option value="asian">Asian</option><option value="mixed">Mixed / Multiple</option><option value="other">Other</option><option value="prefer-not">Prefer not to say</option></select></div></div>);
        if(done){
          if(err)return<div className="wait-screen"><FadeIn delay={0}><p style={{fontSize:16,color:"#c00",marginBottom:20}}>Something went wrong: {err}</p></FadeIn><FadeIn delay={200}><button className="btn-primary" onClick={()=>window.location.reload()}>Try again</button></FadeIn></div>;
          if(!aReady)return(<div className="wait-screen"><FadeIn delay={200}><div className="wait-progress"><div className="wait-bar"><div className="wait-fill" style={{width:gProg+"%"}}/></div><p className="copy" style={{textAlign:"center",fontSize:14}}>{STAGE_LABELS[gStage]||"Preparing\u2026"}</p></div></FadeIn><FadeIn delay={500}>{demoForm}</FadeIn></div>);
          return(<div className="wait-screen"><FadeIn delay={0}><div className="ready-icon">&#10003;</div></FadeIn><FadeIn delay={300}><h2 style={{fontSize:22,fontWeight:300,marginBottom:12}}>Your experience is ready</h2><p className="copy" style={{maxWidth:340,margin:"0 auto 12px",fontSize:14}}>Put on headphones. When you feel a chill, <strong>tap the screen</strong>.</p></FadeIn><FadeIn delay={600}>{demoForm}</FadeIn><FadeIn delay={900}><button className="btn-primary" style={{marginTop:24}} onClick={go}>Start listening</button></FadeIn></div>);
        }
        const bx=200,pp=1-(cd-1)/3;
        const dx=pi===0?pp*bx:pi===1?bx:pi===2?bx-pp*bx:0;
        const dy=pi===0?0:pi===1?pp*bx:pi===2?bx:bx-pp*bx;
        return(<div className="breathing-screen"><FadeIn delay={200}><div className="breath-box-wrap"><div className="breath-box"><div className="breath-countdown">{cd}</div></div><div className="breath-dot" style={{left:dx-6,top:dy-6}}/><div className={`breath-phase-label top ${pi===0?"active":""}`}>Breathe In</div><div className={`breath-phase-label right ${pi===1?"active":""}`}>Hold</div><div className={`breath-phase-label bottom ${pi===2?"active":""}`}>Breathe Out</div><div className={`breath-phase-label left ${pi===3?"active":""}`}>Hold</div></div></FadeIn><div className="breath-cycle">{cy} of {TC}</div><div className="breath-progress"><div className="breath-progress-fill" style={{width:(prog*100)+"%"}}/></div><div className="gen-progress"><div className="gen-bar"><div className="gen-fill" style={{width:gProg+"%"}}/></div><div className="gen-label">{STAGE_LABELS[gStage]||""}</div></div>{skip&&<button className="skip-btn" onClick={()=>setDone(true)}>Skip</button>}</div>);
      }

      function ChillsExperience({audioUrl,onDone}){
        const cvR=useRef();const S=useRef({cP:[],touched:false,spots:0});const[spots,setSpots]=useState(0);const[hint,setHint]=useState(false);const[hGone,setHGone]=useState(false);const cTs=useRef([]);const auStart=useRef(0);
        function rsz(){const dp=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;if(!cvR.current)return;const c=cvR.current;c.width=W*dp;c.height=H*dp;c.style.width=W+"px";c.style.height=H+"px";c.getContext("2d").setTransform(dp,0,0,dp,0,0)}
        useEffect(()=>{let on=true;window.addEventListener("resize",rsz);setTimeout(rsz,200);function loop(){if(!on)return;requestAnimationFrame(loop);const s=S.current,W=window.innerWidth,H=window.innerHeight;const ctx=cvR.current?.getContext("2d");if(!ctx)return;ctx.globalAlpha=1;ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);for(let i=s.cP.length-1;i>=0;i--){const p=s.cP[i];p.t++;p.life-=p.decay;if(p.life<=0){s.cP.splice(i,1);continue}const drift=p.isCore?0.05:0.15+p.life*0.85;p.x+=p.vx*drift;p.y+=p.vy*drift;const pulse=0.65+0.35*Math.sin(p.t*0.008+p.pp);const a=p.life*pulse;const sz=p.size*(1+Math.random()*0.3);ctx.globalAlpha=a*0.95;ctx.fillStyle="hsla("+p.h+",40%,"+p.l+"%,"+a+")";ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fill()}if(s.cP.length>3000)s.cP.splice(0,s.cP.length-3000)}loop();return()=>{on=false;window.removeEventListener("resize",rsz)}},[]);
        useEffect(()=>{const au=new Audio();au.crossOrigin="anonymous";au.src=audioUrl;au.addEventListener("canplaythrough",()=>{au.play();auStart.current=Date.now();setTimeout(()=>{if(!S.current.touched)setHint(true)},2000)},{once:true});au.addEventListener("ended",()=>{setTimeout(()=>onDone({spots:S.current.spots,timestamps:cTs.current}),1500)});au.addEventListener("error",()=>{console.error("[ReWire] Audio error")})},[]);
        const tap=useCallback(e=>{e.preventDefault();const s=S.current;const x=e.clientX||(e.touches&&e.touches[0].clientX)||0,y=e.clientY||(e.touches&&e.touches[0].clientY)||0;if(auStart.current>0)cTs.current.push(parseFloat(((Date.now()-auStart.current)/1000).toFixed(2)));const n=40+Math.floor(Math.random()*20);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;const isCore=i<15;const sp=isCore?0.005+Math.random()*0.015:0.08+Math.random()*0.3;s.cP.push({x:x+(Math.random()-0.5)*(isCore?8:0.45),y:y+(Math.random()-0.5)*(isCore?8:0.45),life:1,decay:isCore?0.00002+Math.random()*0.00004:0.00004+Math.random()*0.0001,size:isCore?3.5+Math.random()*2.5:2.5+Math.random()*3.5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(isCore?0.001:0.008),l:isCore?65+Math.random()*15:55+Math.random()*15,h:200+Math.random()*20,pp:Math.random()*Math.PI*2,t:0,isCore})}s.spots++;setSpots(s.spots);if(!s.touched){s.touched=true;setHint(false);setTimeout(()=>setHGone(true),1600)}},[]);
        return(<div style={{position:"fixed",inset:0,zIndex:50,background:"#000"}}><canvas ref={cvR} style={{position:"absolute",inset:0,zIndex:1}}/><div style={{position:"absolute",inset:0,zIndex:5,cursor:"crosshair"}} onPointerDown={tap}/><div style={{position:"absolute",top:22,left:24,right:24,zIndex:60,display:"flex",justifyContent:"space-between",alignItems:"center",pointerEvents:"none"}}><span style={{fontSize:11,fontWeight:300,letterSpacing:".1em",color:"rgba(255,255,255,.7)"}}>{spots>0?"chills: "+spots:""}</span></div>{!hGone&&<div style={{position:"absolute",bottom:88,left:"50%",transform:"translateX(-50%)",zIndex:10,fontSize:13,fontWeight:300,color:"rgba(255,255,255,.3)",letterSpacing:".02em",whiteSpace:"nowrap",transition:"opacity 1.5s",opacity:hint?1:0}}>tap when you feel something</div>}</div>);
      }

      function NoteStack({sessionId}){
        const[notes,setNotes]=useState([{id:"post-jolt",when:new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).toUpperCase(),text:"",prompt:"Save what came up from your Jolt. What did you notice, feel, or remember?",jolted:true}]);
        const[idx,setIdx]=useState(0);const saveTimer=useRef(null);const notesRef=useRef(notes);notesRef.current=notes;

        const doSave=useCallback(()=>{if(!sessionId)return;fetch(API_BASE+"/api/demo/notes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,notes_json:JSON.stringify(notesRef.current)})}).catch(()=>{})},[sessionId]);
        const scheduleSave=useCallback(()=>{if(saveTimer.current)clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>doSave(),5000)},[doSave]);
        useEffect(()=>{return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);doSave()}},[doSave]);
        const addNote=()=>{const n={id:"note-"+Date.now(),when:new Date().toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).toUpperCase(),text:"",jolted:false};setNotes(p=>[n,...p]);setIdx(0);scheduleSave()};
        const joltNote=id=>{setNotes(p=>p.map(n=>n.id===id?{...n,jolted:true}:n));scheduleSave()};
        const updateText=(id,text)=>{setNotes(p=>p.map(n=>n.id===id?{...n,text}:n));scheduleSave()};
        const cur=notes[idx];const canPrev=idx>0;const canNext=idx<notes.length-1;
        return(<div className="stack-bg"><div className="stack-wrap"><div className="topbar"><button className="nav-btn" style={{background:canPrev?"rgba(0,0,0,0.06)":"transparent",color:canPrev?"var(--ink)":"transparent"}} onClick={()=>canPrev&&setIdx(idx-1)}>&lsaquo;</button><span style={{fontSize:13,color:"var(--muted)",fontWeight:600}}>{notes.length} note{notes.length!==1?"s":""} &middot; {idx+1} of {notes.length}</span><button className="nav-btn" style={{background:canNext?"rgba(0,0,0,0.06)":"transparent",color:canNext?"var(--ink)":"transparent"}} onClick={()=>canNext&&setIdx(idx+1)}>&rsaquo;</button></div><div className="stack-scene">{cur&&<div className={`note-card ${cur.jolted?"jolted":""}`}><div className="note-head"><div><div className="note-meta mono">{cur.when}</div></div><button className={`jolt-note-btn ${cur.jolted?"is-jolted":""}`} onClick={()=>joltNote(cur.id)}>{cur.jolted?"JOLTED":"JOLT"}</button></div><div className="note-body"><textarea value={cur.text} onChange={e=>updateText(cur.id,e.target.value)} placeholder={cur.prompt||"Write what just lit up..."}/></div></div>}</div><div className="plus-wrap"><button className="plus-button" onClick={addNote}>+</button><div className="plus-label">New note</div></div></div></div>);
      }

      function Done({onAutoAdvance}){
        useEffect(()=>{const t=setTimeout(()=>onAutoAdvance(),1000);return()=>clearTimeout(t)},[]);
        return(<div className="done-wrap"><FadeIn delay={200}><div className="ready-icon">&#10003;</div></FadeIn><FadeIn delay={400}><h2 style={{fontSize:28,fontWeight:200,marginBottom:12}}>Thank you</h2></FadeIn><FadeIn delay={600}><p className="copy" style={{maxWidth:280,margin:"0 auto 30px",lineHeight:1.7}}>Your response helps us understand what moves people. That matters more than you know.</p></FadeIn></div>);
      }

      function App(){
        const[phase,setPhase]=useState("splash");const[obStep,setObStep]=useState(0);const[answers,setAnswers]=useState({});const[sessionData,setSessionData]=useState({sessionId:null,audioUrl:null});const[chillsData,setChillsData]=useState({spots:0,timestamps:[]});
        if(phase==="splash")return<Splash onStart={()=>setPhase("onboarding")}/>;
        if(phase==="onboarding")return<OnboardingScreen step={obStep} onNext={()=>{if(obStep<ONBOARDING.length-1)setObStep(obStep+1);else setPhase("questions");}} onSkip={a=>{if(a==="back"&&obStep>0)setObStep(obStep-1);else if(a==="splash")setPhase("splash");else setPhase("questions");}}/>;
        if(phase==="questions")return<ChillsQuestions onNext={ans=>{setAnswers(ans);setPhase("breathing");}}/>;
        if(phase==="breathing")return<BreathingAndGenerating answers={answers} onReady={d=>{setSessionData(d);setPhase("player");}}/>;
        if(phase==="player")return<ChillsExperience audioUrl={sessionData.audioUrl} onDone={d=>{setChillsData(d);setPhase("feedback");}}/>;
        if(phase==="feedback")return<Feedback spots={chillsData.spots} timestamps={chillsData.timestamps} sessionId={sessionData.sessionId} onDone={()=>setPhase("done")}/>;
        if(phase==="done")return<Done onAutoAdvance={()=>setPhase("notes")}/>;
        if(phase==="notes")return<NoteStack sessionId={sessionData.sessionId}/>;
        return null;
      }
      ReactDOM.render(<App/>,document.getElementById("root"));
    </script>
  </body>
</html>
