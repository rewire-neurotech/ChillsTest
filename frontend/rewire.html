              <div class="composer">
                <div class="composer-box">
                  <p class="composer-instruction">Anything you want to share \u2014 what came up, what worked, what didn't.</p>
                  <div class="composer-pill">
                    <input
                      data-input="feedback"
                      type="text"
                      autocomplete="off"
                      autocapitalize="sentences"
                      enterkeyhint="send"
                      value="${escapeAttr(state.feedback)}"
                      placeholder="Share your feedback..."
                    />
                    <button class="send ${ready ? "ready" : ""}" data-action="feedback-send" aria-label="Send">\u2191</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderDone() {
        const emailReady = isValidEmail(state.email);
        const subscribed = state.emailSubmitted;

        // Focused email mode: just the field at the top, keyboard fills the rest.
        // The user lands here when they tap the email row on the regular done screen.
        if (state.emailFocused && !subscribed) {
          return `
            <section class="screen email-focus-screen">
              <div class="topbar">
                <button class="back" data-action="cancel-email" aria-label="Back">\u2039</button>
                <span></span>
              </div>
              <div class="email-focus-content">
                <h2 class="email-focus-title">Sign up for the beta</h2>
                <p class="email-focus-sub">We\u2019ll email you when Jolter launches in September 2026.</p>
                <div class="composer-box" style="margin-top:16px;">
                  <div class="composer-pill">
                    <input
                      id="emailField"
                      type="email"
                      inputmode="email"
                      autocomplete="email"
                      enterkeyhint="done"
                      data-input="email"
                      placeholder="you@example.com"
                      value="${escapeAttr(state.email)}"
                    />
                    <button class="send ${emailReady ? "ready" : ""}" data-action="submit-email" aria-label="Submit email" ${emailReady ? "" : "disabled"}>\u2191</button>
                  </div>
                </div>
              </div>
            </section>
          `;
        }

        return `
          <section class="screen">
            <div class="topbar">
              <span></span>
              <span></span>
            </div>
            <div class="done">
              <div class="done-hero">
                <img class="done-logo" src="${LOGO_SRC}" alt="" />
                <h1 class="done-title">Thank you.</h1>
                ${subscribed ? "" : `<p class="done-body">Jolter launches in <strong>September 2026</strong>. Drop your email below to join the beta.</p>`}
              </div>
              <div class="done-email">
                ${
                  subscribed
                    ? `
                  <div class="email-success">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    You\u2019re on the beta list. See you in September.
                  </div>
                `
                    : `
                  <span class="email-label">Sign up for the beta</span>
                  <button class="email-row email-row-ghost" data-action="focus-email" aria-label="Enter your email">
                    <span class="email-ghost-text ${state.email ? "has-value" : ""}">${state.email ? escapeAttr(state.email) : "you@example.com"}</span>
                    <span class="email-submit ${emailReady ? "ready" : ""}">\u2192</span>
                  </button>
                `
                }
              </div>
              <div class="done-actions">
                <button class="primary" data-action="invite-friend">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
                    <polyline points="16 6 12 2 8 6"/>
                    <line x1="12" y1="2" x2="12" y2="15"/>
                  </svg>
                  Invite a friend
                </button>
                <button class="secondary" data-action="restart">Start again</button>
              </div>
              <div class="done-footer">
                <a href="https://rewire.bio" target="_blank" rel="noopener">\u00a9 ReWire Neurotechnologies, Inc.</a>
              </div>
            </div>
          </section>
        `;
      }

      // ============ RENDER ============
      let pollTimer = null;

      function render() {
        stopAllAudio();
        stopIntroAnim();
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }

        // Match body, html AND #app background to current screen theme so no
        // white bleed shows when the keyboard opens or on devices with
        // bottom safe areas.  #app stays full viewport; the gap between
        // the --vh-sized screen and #app's bottom shows #app's background.
        const darkScreens = ["headphones", "meditation", "stimulus", "intro"];
        const isDark = darkScreens.includes(state.screen);
        const warmScreens = ["sticky-notes", "first-sticky"];
        const isWarm = warmScreens.includes(state.screen);
        // Use per-screen bottom color for seamless gap coverage
        let bgColor;
        if (state.screen === "headphones") bgColor = "#0c0c0e";
        else if (state.screen === "intro" || state.screen === "first-sticky") bgColor = "#efece6";
        else if (isWarm) bgColor = "#efece6";
        else if (isDark) bgColor = "#000";
        else bgColor = "#fff";
        document.documentElement.style.background = bgColor;
        document.body.style.background = bgColor;
        app.style.background = bgColor;
        // Update theme-color meta so the system navigation bar / status bar
        // matches the current screen's background on Android and iOS.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bgColor);
        // Also update fullscreen body background
        const fs = document.querySelector(':fullscreen body, :-webkit-full-screen body');
        // (CSS handles this via :fullscreen selectors, but we set body bg above as well)

        if (state.screen === "splash") {
          app.innerHTML = renderSplash();
          setTimeout(() => {
            const vid = document.getElementById("splashVideo");
            if (vid) {
              // Start muted so autoplay is guaranteed by all browsers
              vid.muted = true;
              vid.play().catch(() => {});
              // Unmute on the very first user interaction (browsers require a gesture for sound)
              const unmute = () => {
                if (vid && !vid.ended && !vid.paused) {
                  vid.muted = false;
                }
                document.removeEventListener("pointerdown", unmute);
                document.removeEventListener("touchstart", unmute);
              };
              document.addEventListener("pointerdown", unmute, { once: true });
              document.addEventListener("touchstart", unmute, { once: true, passive: true });
            }
          }, 50);
        } else if (state.screen === "login") app.innerHTML = renderLogin();
        else if (state.screen === "register") app.innerHTML = renderRegister();
        else if (state.screen === "intro") {
          app.innerHTML = renderIntro();
          startIntroAnim();
        } else if (state.screen === "onboarding")
          app.innerHTML = renderOnboarding();
        else if (state.screen === "question") app.innerHTML = renderQuestion();
        else if (state.screen === "survey") app.innerHTML = renderSurvey();
        else if (state.screen === "headphones") {
          app.innerHTML = renderHeadphones();
          startHeadphonesAnim();
        } else if (state.screen === "meditation") {
          app.innerHTML = renderMeditation();
          startMeditation();
        } else if (state.screen === "stimulus") {
          app.innerHTML = renderStimulus();
          startStimulus();
        } else if (state.screen === "first-sticky") {
          app.innerHTML = renderFirstSticky();
          startFirstStickyAnim();
        } else if (state.screen === "sticky-notes") {
          app.innerHTML = renderStickyNotes();
          startStickyNotes();
        } else if (state.screen === "feedback")
          app.innerHTML = renderFeedback();
        else if (state.screen === "done") app.innerHTML = renderDone();

        // Auto-focus inputs -- but NOT on question screens (Felix: keyboard should not auto-open)
        // and NOT on done screen unless email is focused, and NOT on intro / headphones /
        // first-sticky / sticky-notes (sticky-notes has its own textarea focus logic).
        if (
          state.screen !== "question" &&
          state.screen !== "survey" &&
          state.screen !== "splash" &&
          state.screen !== "intro" &&
          state.screen !== "headphones" &&
          state.screen !== "first-sticky" &&
          state.screen !== "sticky-notes"
        ) {
          const input = app.querySelector("input[data-input]");
          const isDoneScreen = state.screen === "done" && !state.emailFocused;
          if (input && !isDoneScreen) {
            requestAnimationFrame(() => input.focus({ preventScroll: true }));
          }
        }
      }

      // ============ AUTH FLOW ============
      async function doLogin() {
        const email = (state._loginEmail || "").trim();
        const pw = app.querySelector('[data-input="login-password"]');
        const password = pw ? pw.value : "";
        if (!email || !password) {
          state.authError = "Please enter email and password.";
          render();
          return;
        }
        try {
          const res = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password }),
          });
          state.token = res.token;
          state.user = {
            id: res.user_id,
            email: res.email,
            name: res.name,
            hasCompletedFirstJolt: res.has_completed_first_jolt,
            hasSubscription: res.has_subscription,
          };
          localStorage.setItem("jolter_token", res.token);
          state.authError = "";
          startIntro();
        } catch (e) {
          state.authError = e.message || "Login failed.";
          render();
        }
      }

      async function doRegister() {
        const name = (state._regName || "").trim();
        const email = (state._regEmail || "").trim();
        const pw = app.querySelector('[data-input="reg-password"]');
        const password = pw ? pw.value : "";
        if (!email || !password) {
          state.authError = "Please enter email and password.";
          render();
          return;
        }
        if (password.length < 6) {
          state.authError = "Password must be at least 6 characters.";
          render();
          return;
        }
        try {
          const res = await api("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({ email, password, name: name || null }),
          });
          state.token = res.token;
          state.user = {
            id: res.user_id,
            email: res.email,
            name: res.name,
            hasCompletedFirstJolt: res.has_completed_first_jolt,
            hasSubscription: res.has_subscription,
          };
          localStorage.setItem("jolter_token", res.token);
          state.authError = "";
          startIntro();
        } catch (e) {
          state.authError = e.message || "Registration failed.";
          render();
        }
      }

      let googleClientId = null;
      let googleReady = false;

      async function initGoogleSignIn() {
        try {
          const res = await api("/api/auth/config");
          googleClientId = res.google_client_id;
          if (!googleClientId) return;
          // Wait for GIS script to load
          const waitForGoogle = () =>
            new Promise((resolve) => {
              if (typeof google !== "undefined" && google.accounts)
                return resolve();
              const check = setInterval(() => {
                if (typeof google !== "undefined" && google.accounts) {
                  clearInterval(check);
                  resolve();
                }
              }, 200);
              setTimeout(() => {
                clearInterval(check);
                resolve();
              }, 5000);
            });
          await waitForGoogle();
          if (typeof google === "undefined" || !google.accounts) return;
          googleReady = true;
        } catch (e) {
          /* Google sign-in not available */
        }
      }

      async function handleGoogleCredential(response) {
        // Remove popup if present
        const w = document.getElementById("gsi-wrapper");
        if (w) w.remove();
        if (!response || !response.credential) return;
        try {
          const res = await api("/api/auth/google", {
            method: "POST",
            body: JSON.stringify({ credential: response.credential }),
          });
          state.token = res.token;
          state.user = {
            id: res.user_id,
            email: res.email,
            name: res.name,
            hasCompletedFirstJolt: res.has_completed_first_jolt,
            hasSubscription: res.has_subscription,
          };
          localStorage.setItem("jolter_token", res.token);
          state.authError = "";
          startIntro();
        } catch (e) {
          state.authError = e && e.message ? e.message : "Google login failed.";
          render();
        }
      }

      function doGoogleLogin() {
        if (!googleReady || !googleClientId) {
          state.authError =
            "Google sign-in is not available. Please use email/password.";
          render();
          return;
        }
        // Initialize fresh each time to avoid stale state
        google.accounts.id.initialize({
          client_id: googleClientId,
          callback: handleGoogleCredential,
          ux_mode: "popup",
          use_fedcm_for_prompt: true,
        });
        // Render Google's own button in a popup overlay
        const existing = document.getElementById("gsi-wrapper");
        if (existing) existing.remove();
        const wrapper = document.createElement("div");
        wrapper.id = "gsi-wrapper";
        wrapper.style.cssText =
          "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;";
        wrapper.innerHTML =
          '<div style="background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.15);"><div id="gsi-btn"></div><p style="text-align:center;margin:16px 0 0;font-size:13px;color:#888;">Choose your Google account</p></div>';
        document.body.appendChild(wrapper);
        // Render the real Google button
        google.accounts.id.renderButton(document.getElementById("gsi-btn"), {
          type: "standard",
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "pill",
          width: 300,
        });
        // Close on backdrop click
        wrapper.addEventListener("click", (e) => {
          if (e.target === wrapper) wrapper.remove();
        });
      }

      // ============ INTRO FLOW ============
      // Replaces the 3-slide onboarding per Felix's spec.
      function startIntro() {
        state.screen = "intro";
        render();
      }

      // ============ ONBOARDING FLOW (legacy, kept dormant) ============
      // Old 3-slide onboarding code retained but unreachable from the
      // main flow. Safe to delete in a later pass once intro is signed off.
      function startOnboarding() {
        state.screen = "onboarding";
        state.onboardIndex = 0;
        render();
      }

      function nextOnboard() {
        if (state.onboardIndex < onboarding.length - 1) {
          state.onboardIndex += 1;
          render();
        } else {
          startQuestions();
        }
      }

      function backOnboard() {
        if (state.onboardIndex > 0) {
          state.onboardIndex -= 1;
          render();
        } else {
          state.screen = "splash";
          render();
        }
      }

      // ============ QUESTION FLOW ============
      function startQuestions() {
        state.screen = "question";
        state.questionIndex = 0;
        state.draft = state.answers[questions[0].id] || "";
        render();
      }

      function backQuestion() {
        if (state.questionIndex > 0) {
          state.questionIndex -= 1;
          state.draft = state.answers[questions[state.questionIndex].id] || "";
          render();
        } else {
          // Back from Q1 goes to survey (Q0)
          state.screen = "survey";
          render();
        }
      }

      function sendQuestion() {
        const q = questions[state.questionIndex];
        const value = state.draft.trim();
        if (!value) return;
        state.answers[q.id] = value;
        if (state.questionIndex < questions.length - 1) {
          state.questionIndex += 1;
          state.draft = state.answers[questions[state.questionIndex].id] || "";
          render();
        } else {
          // All questions done -> show headphones screen first.
          // Generation kicks off when the user taps "I'm ready" — this
          // way we don't start an API call the user might back out of,
          // and the meditation audio starts in sync with their consent.
          state.screen = "headphones";
          render();
        }
      }

      // ============ GENERATION + MEDITATION ============
      async function startGeneration() {
        try {
          const body = {
            q0_wish_easier: state.surveyAnswer || "",
            q1_low_voice: state.answers.lowVoice || "",
            q2_chills: state.answers.chills || "",
            q3_first_call: state.answers.firstCall || "",
            q4_unseen: state.answers.unseen || "",
            place: state.userPlace,
          };
          const res = await api("/api/demo/generate", {
            method: "POST",
            body: JSON.stringify(body),
          });
          state.jobId = res.job_id;
          state.meditationUrl = res.meditation_url;
          state.genDone = false;
          state.meditationDone = false;
          state.genProgress = 0;
          state.genStage = "queued";
          state.screen = "meditation";
          saveFlowState();
          render();
        } catch (e) {
          alert("Generation failed: " + e.message);
        }
      }

      function startMeditation() {
        // Init particles
        setTimeout(() => initParticles("pCanvas"), 50);
        // Acquire wake lock and set up media session
        acquireWakeLock();
        setupMediaSession("Meditation");
        // Play meditation audio
        if (state.meditationUrl) {
          meditationAudio = new Audio(state.meditationUrl);
          meditationAudio.play().catch(() => {});
          meditationAudio.onended = handleMeditationEnd;
        }
        // Start polling generation status
        pollTimer = setInterval(pollStatus, 2500);
        pollStatus();
      }

      async function pollStatus() {
        if (!state.jobId) return;
        try {
          const res = await api("/api/demo/generate/status/" + state.jobId);
          state.genProgress = res.progress || 0;
          state.genStage = res.stage || "queued";
          if (res.stage === "done") {
            state.genDone = true;
            state.sessionId = res.session_id;
            state.audioUrl = res.audio_url;
            if (pollTimer) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
            checkTransitionToStimulus();
          } else if (res.stage === "error") {
            if (pollTimer) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
            alert("Generation error: " + (res.error || "Unknown error"));
          }
          // Update wait overlay if visible
          const fill = app.querySelector(".wait-progress-fill");
          if (fill) fill.style.width = state.genProgress + "%";
        } catch (e) {
          /* silent */
        }
      }

      function handleMeditationEnd() {
        state.meditationDone = true;
        checkTransitionToStimulus();
      }

      function checkTransitionToStimulus() {
        if (state.genDone && state.meditationDone) {
          // Seamless transition: don't rebuild DOM, just swap audio and update HUD
          state.screen = "stimulus";
          state.chillsCount = 0;
          state.chillsTimestamps = [];
          // Remove wait overlay if present
          const overlay = app.querySelector(".wait-overlay");
          if (overlay) overlay.remove();
          // Update HUD in-place (no canvas rebuild, particles keep running)
          const hudTop = app.querySelector(".canvas-hud-top");
          if (hudTop)
            hudTop.innerHTML =
              '<span class="chills-counter"></span><span></span>';
          const hint = app.querySelector(".canvas-hint");
          if (hint) hint.textContent = "tap when you feel something";
          // Start stimulus audio (meditation already stopped via onended)
          if (state.audioUrl) {
            stimulusAudio = new Audio(state.audioUrl);
            stimulusAudio.play().catch((err) => {
              console.warn("[Stimulus] Audio play failed:", err);
              // Autoplay may be blocked — show a tap-to-play prompt
              const hint = app.querySelector(".canvas-hint");
              if (hint) hint.textContent = "tap to play your Jolt";
              const tapHandler = () => {
                document.removeEventListener("pointerdown", tapHandler);
                if (stimulusAudio) {
                  stimulusAudio.play().catch(() => {
                    // Still can't play — skip to first-sticky
                    setTimeout(goToFirstSticky, 500);
                  });
                }
              };
              document.addEventListener("pointerdown", tapHandler, { once: true });
            });
            stimulusAudio.onerror = () => {
              console.warn("[Stimulus] Audio load error for", state.audioUrl);
              // Audio file missing (e.g. /tmp eviction) — skip to next screen
              setTimeout(goToFirstSticky, 1500);
            };
            state.audioStartTime = Date.now();
            setupMediaSession("Your Jolt");
            stimulusAudio.onended = () => {
              setTimeout(goToFirstSticky, 1500);
            };
          } else {
            // No audio URL — skip to first-sticky after a brief pause
            setTimeout(goToFirstSticky, 1500);
          }
        } else if (state.meditationDone && !state.genDone) {
          // Show wait overlay
          const overlay = app.querySelector(".wait-overlay");
          if (!overlay) {
            const pct = Math.min(state.genProgress || 0, 100);
            const waitHtml = `
              <div class="wait-overlay">
                <div class="wait-label">Preparing your experience...</div>
                <div class="wait-progress-bar">
                  <div class="wait-progress-fill" style="width:${pct}%"></div>
                </div>
              </div>
            `;
            const section = app.querySelector(".canvas-screen");
            if (section) section.insertAdjacentHTML("beforeend", waitHtml);
          }
        }
      }

      // ============ STIMULUS ============
      function startStimulus() {
        setTimeout(() => initParticles("pCanvas"), 50);
        acquireWakeLock();
        setupMediaSession("Your Jolt");
        if (state.audioUrl) {
          stimulusAudio = new Audio(state.audioUrl);
          stimulusAudio.play().catch((err) => {
            console.warn("[Stimulus] Audio play failed:", err);
            const hint = app.querySelector(".canvas-hint");
            if (hint) hint.textContent = "tap to play your Jolt";
            const tapHandler = () => {
              document.removeEventListener("pointerdown", tapHandler);
              if (stimulusAudio) {
                stimulusAudio.play().catch(() => {
                  setTimeout(goToFirstSticky, 500);
                });
              }
            };
            document.addEventListener("pointerdown", tapHandler, { once: true });
          });
          stimulusAudio.onerror = () => {
            console.warn("[Stimulus] Audio load error for", state.audioUrl);
            setTimeout(goToFirstSticky, 1500);
          };
          state.audioStartTime = Date.now();
          stimulusAudio.onended = () => {
            setTimeout(goToFirstSticky, 1500);
          };
        }
      }

      // ============ FIRST-STICKY FLOW ============
      // Lands the user on Felix's "you did your first session" screen
      // 1.5s after stimulus audio ends. From here "Capture it" advances
      // to the next step (currently feedback; becomes sticky-notes in 4.5).
      function goToFirstSticky() {
        stopParticles();
        stopAllAudio();
        releaseWakeLock();
        clearFlowState();

        // Auto-save chills data before leaving stimulus
        saveChillsData();

        if (state.noteJoltMode) {
          // Returning from a note jolt: mark note as watched and go to sticky-notes
          const n = snNotes.find((x) => String(x.id) === String(state.joltNoteId));
          if (n) {
            n.state = "watched";
            // Update backend state
            api(`/api/notes/${n.id}/state`, {
              method: "PUT",
              body: JSON.stringify({ state: "watched" }),
            }).catch(() => {});
          }
          state.noteJoltMode = false;
          state.joltNoteId = null;
          state.joltSessionId = null;
          state.screen = "sticky-notes";
          render();
          return;
        }

        state.screen = "first-sticky";
        render();
      }

      function logChill() {
        state.chillsCount++;
        const elapsed = (Date.now() - state.audioStartTime) / 1000;
        state.chillsTimestamps.push(Math.round(elapsed * 10) / 10);
        const counter = app.querySelector(".chills-counter");
        if (counter) counter.textContent = state.chillsCount + " chills";
      }

      // ============ FEEDBACK FLOW ============
      function goToFeedback() {
        stopParticles();
        stopAllAudio();
        state.screen = "feedback";
        state.feedback = "";
        render();
      }

      async function sendFeedback() {
        if (!state.feedback.trim()) return;
        // Save to backend
        if (state.sessionId) {
          try {
            await api("/api/demo/feedback", {
              method: "POST",
              body: JSON.stringify({
                session_id: state.sessionId,
                chills_count: state.chillsCount,
                chills_timestamps_json: JSON.stringify(state.chillsTimestamps),
                feedback_text: state.feedback.trim(),
              }),
            });
          } catch (e) {
            /* silent */
          }
        }
        state.screen = "done";
        render();
      }

      // ============ DONE FLOW ============
      function focusEmail() {
        state.emailFocused = true;
        render();
      }

      function cancelEmail() {
        state.emailFocused = false;
        render();
      }

      async function submitEmail() {
        if (!isValidEmail(state.email)) return;
        if (state.sessionId) {
          try {
            await api("/api/demo/email", {
              method: "POST",
              body: JSON.stringify({
                session_id: state.sessionId,
                email: state.email.trim(),
              }),
            });
          } catch (e) {
            /* silent */
          }
        }
        state.emailSubmitted = true;
        state.emailFocused = false;
        render();
      }

      async function inviteFriend() {
        const shareData = {
          title: "Jolter",
          text: "I just tried Jolter \u2014 a daily 5-minute booster. Try it: ",
          url: window.location.origin,
        };
        if (navigator.share) {
          try {
            await navigator.share(shareData);
          } catch (err) {}
        } else if (navigator.clipboard) {
          try {
            await navigator.clipboard.writeText(shareData.text + shareData.url);
            const btn = app.querySelector('[data-action="invite-friend"]');
            if (btn) {
              const original = btn.innerHTML;
              btn.innerHTML = "Link copied \u2713";
              setTimeout(() => {
                btn.innerHTML = original;
              }, 1800);
            }
          } catch (err) {
            window.prompt("Copy this link:", shareData.url);
          }
        }
      }

      function restart() {
        stopParticles();
        stopAllAudio();
        clearFlowState();
        state.screen = "splash";
        state.onboardIndex = 0;
        state.questionIndex = 0;
        state.answers = {};
        state.draft = "";
        state.surveyAnswer = "";
        state.feedback = "";
        state.email = "";
        state.emailSubmitted = false;
        state.emailFocused = false;
        state.jobId = null;
        state.sessionId = null;
        state.audioUrl = null;
        state.meditationUrl = null;
        state.genDone = false;
        state.meditationDone = false;
        state.chillsCount = 0;
        state.chillsTimestamps = [];
        state.noteJoltMode = false;
        state.joltNoteId = null;
        state.joltSessionId = null;
        render();
      }

      // ============ EVENT HANDLERS ============

      // Prevent input blur when tapping send buttons so the first tap submits
      // instead of just dismissing the keyboard. Covers ALL send/submit buttons.
      const _sendBtnSelector = ".send, .email-submit, [data-action='q-send'], [data-action='survey-send'], [data-action='feedback-send'], [data-action='submit-email'], [data-action='do-login'], [data-action='do-register']";
      app.addEventListener("mousedown", (e) => {
        const btn = e.target && e.target.closest && e.target.closest(_sendBtnSelector);
        if (btn) e.preventDefault();
      });
      app.addEventListener("touchstart", (e) => {
        const btn = e.target && e.target.closest && e.target.closest(_sendBtnSelector);
        if (btn) e.preventDefault();
      }, { passive: false });
      // On iOS, preventDefault on touchstart can suppress the synthetic click.
      // Fire the action directly on touchend so the first tap always submits.
      app.addEventListener("touchend", (e) => {
        const btn = e.target && e.target.closest && e.target.closest(_sendBtnSelector);
        if (!btn) return;
        e.preventDefault(); // suppress delayed click to avoid double-fire
        btn.click();        // manually trigger click handler synchronously
      }, { passive: false });

      app.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.dataset.action;

        switch (action) {
          // splash
          case "go-register":
            state.authError = "";
            state.screen = "register";
            render();
            break;
          case "go-login":
            state.authError = "";
            state.screen = "login";
            render();
            break;
          case "go-splash":
            state.screen = "splash";
            render();
            break;
          // auth
          case "do-login":
            doLogin();
            break;
          case "do-register":
            doRegister();
            break;
          case "google-login":
            doGoogleLogin();
            break;
          // intro
          case "intro-begin":
            state.screen = "survey";
            render();
            break;
          // onboarding (legacy)
          case "start":
            startOnboarding();
            break;
          case "onboard-next":
            nextOnboard();
            break;
          case "onboard-back":
            backOnboard();
            break;
          case "onboard-skip":
            startQuestions();
            break;
          // questions
          case "q-back":
            backQuestion();
            break;
          case "q-send":
            sendQuestion();
            break;
          // survey (Q0)
          case "survey-back":
            state.screen = "intro";
            render();
            break;
          case "survey-skip":
            state.surveyAnswer = "";
            startQuestions();
            break;
          case "survey-pick":
            state.surveyAnswer = btn.dataset.value || "";
            startQuestions();
            break;
          case "survey-send":
            if (state.surveyAnswer && state.surveyAnswer.trim()) {
              startQuestions();
            }
            break;
          // headphones
          case "headphones-ready":
            startGeneration();
            break;
          // meditation/stimulus
          case "canvas-tap":
            if (state.screen === "stimulus") {
              logChill();
              const rect = app
                .querySelector("#pCanvas")
                .getBoundingClientRect();
              spawnParticles(e.clientX - rect.left, e.clientY - rect.top);
            } else if (state.screen === "meditation") {
              const rect = app
                .querySelector("#pCanvas")
                .getBoundingClientRect();
              spawnParticles(e.clientX - rect.left, e.clientY - rect.top);
            }
            break;
          // sticky-notes card buttons are handled by the delegated
          // document handler in snInstallListenersOnce — not here.

          // sticky-notes new note button
          case "sn-new":
            snNewBlankNote();
            break;
          // first-sticky
          case "first-sticky-capture":
            // Hand off to the sticky-notes home (Felix's spec).
            state.screen = "sticky-notes";
            render();
            break;
          // feedback
          case "feedback-send":
            sendFeedback();
            break;
          // done
          case "invite-friend":
            inviteFriend();
            break;
          case "focus-email":
            focusEmail();
            break;
          case "cancel-email":
            cancelEmail();
            break;
          case "submit-email":
            submitEmail();
            break;
          case "restart":
            restart();
            break;
        }
      });

      app.addEventListener("input", (e) => {
        const input = e.target;
        if (input.dataset.input === "answer") {
          state.draft = input.value;
          const send = app.querySelector(".send");
          if (send)
            send.classList.toggle("ready", state.draft.trim().length > 0);
        } else if (input.dataset.input === "feedback") {
          state.feedback = input.value;
          const send = app.querySelector(".send");
          if (send)
            send.classList.toggle("ready", state.feedback.trim().length > 0);
        } else if (input.dataset.input === "email") {
          state.email = input.value;
          const submit = app.querySelector('[data-action="submit-email"]');
          if (submit) {
            const valid = isValidEmail(state.email);
            submit.classList.toggle("ready", valid);
            submit.disabled = !valid;
          }
        } else if (input.dataset.input === "login-email") {
          state._loginEmail = input.value;
        } else if (input.dataset.input === "survey-other") {
          state.surveyAnswer = input.value;
          const send = app.querySelector(".send");
          if (send) send.classList.toggle("ready", input.value.trim().length > 0);
          // Deselect preset options when typing custom
          app.querySelectorAll(".survey-option").forEach(b => b.classList.remove("selected"));
        } else if (input.dataset.input === "reg-name") {
          state._regName = input.value;
        } else if (input.dataset.input === "reg-email") {
          state._regEmail = input.value;
        }
      });

      app.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const t = e.target;
        if (t.dataset.input === "answer") {
          e.preventDefault();
          sendQuestion();
        } else if (t.dataset.input === "feedback") {
          e.preventDefault();
          sendFeedback();
        } else if (t.dataset.input === "email") {
          e.preventDefault();
          submitEmail();
        } else if (t.dataset.input === "survey-other") {
          e.preventDefault();
          if (state.surveyAnswer && state.surveyAnswer.trim()) startQuestions();
        } else if (t.dataset.input === "login-password") {
          e.preventDefault();
          doLogin();
        } else if (t.dataset.input === "reg-password") {
          e.preventDefault();
          doRegister();
        }
      });

      // ============ BOOT ============
      // On app start, if a token exists in localStorage, validate it via
      // /api/auth/me and hydrate state.user. If invalid (expired/revoked),
      // clear the stale token. Routing decisions (e.g. skip onboarding for
      // returning users) are layered on later — this step only ensures
      // state.user is trustworthy when present.
      async function bootSession() {
        if (state.token) {
          try {
            const res = await api("/api/auth/me");
            state.user = {
              id: res.user_id,
              email: res.email,
              name: res.name,
              hasCompletedFirstJolt: res.has_completed_first_jolt,
              hasSubscription: res.has_subscription,
            };
            // Returning user who already finished their first jolt lands
            // straight on the sticky-notes home, skipping splash/intro/4Q.
            if (state.user.hasCompletedFirstJolt) {
              // Check for an interrupted meditation/stimulus flow.
              // If the page reloaded mid-flow (browser killed the tab,
              // pull-to-refresh, service-worker restart, etc.) we can
              // resume because the backend still has the generation job.
              const flow = loadFlowState();
              const FLOW_MAX_AGE_MS = 30 * 60 * 1000; // 30 minutes
              if (flow && flow.jobId && flow.ts && (Date.now() - flow.ts < FLOW_MAX_AGE_MS)) {
                try {
                  const st = await api("/api/demo/generate/status/" + flow.jobId);
                  if (st.stage === "done") {
                    // Generation finished while we were away -- jump to stimulus
                    state.jobId = flow.jobId;
                    state.sessionId = st.session_id;
                    state.audioUrl = st.audio_url;
                    state.genDone = true;
                    state.meditationDone = true; // skip meditation replay
                    state.screen = "stimulus";
                  } else if (st.stage === "error") {
                    // Generation failed -- clear flow, land on sticky-notes
                    clearFlowState();
                    state.screen = "sticky-notes";
                  } else {
                    // Still generating -- resume meditation + polling
                    state.jobId = flow.jobId;
                    state.meditationUrl = flow.meditationUrl || null;
                    state.genDone = false;
                    state.meditationDone = false;
                    state.genProgress = st.progress || 0;
                    state.genStage = st.stage || "queued";
                    state.screen = "meditation";
                  }
                } catch (e) {
                  // Status check failed -- clear stale flow, land on sticky-notes
                  clearFlowState();
                  state.screen = "sticky-notes";
                }
              } else {
                // No active flow (or expired) -- normal landing
                clearFlowState();
                state.screen = "sticky-notes";
              }
            }
          } catch (e) {
            state.token = null;
            state.user = null;
            localStorage.removeItem("jolter_token");
          }
        }
        render();
      }

      // ============ INIT ============
      fetchUserLocation();
      initGoogleSignIn();
      bootSession();

      // Register service worker for push notifications
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
</script>
  </body>
</html>
