         Reuses snNudge for the input shake (same generic horizontal jiggle).
         ============================================================ */
      .pw-paywall {
        position: fixed; inset: 0;
        background: radial-gradient(ellipse 90% 70% at 50% -10%,
          #ffffff 0%, #fafaf6 55%, #f0ede5 100%);
        z-index: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity .32s ease;
        overflow: hidden;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pw-paywall.show { opacity: 1; pointer-events: auto; }

      .pw-close {
        appearance: none; border: none; cursor: pointer;
        position: absolute;
        top: calc(18px + env(safe-area-inset-top));
        right: 20px;
        width: 36px; height: 36px; border-radius: 50%;
        background: rgba(0,0,0,0.05);
        color: #1a1a1c;
        display: flex; align-items: center; justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        transition: background .2s ease, transform .18s cubic-bezier(.2,.8,.2,1);
      }
      .pw-close:hover { background: rgba(0,0,0,0.08); }
      .pw-close:active { transform: scale(0.92); }

      .pw-inner {
        height: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 28px 26px;
        display: flex; flex-direction: column; justify-content: center;
        gap: 14px;
        transform: translateY(0);
        overflow-y: auto;
      }
      .pw-paywall.show .pw-inner {
        animation: pwIn .55s cubic-bezier(.2,.8,.2,1);
      }
      @keyframes pwIn {
        from { transform: translateY(16px); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }
      }

      .pw-eyebrow {
        display: inline-flex; align-items: center; gap: 6px;
        align-self: flex-start;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(255,159,26,0.12);
        color: #b56500;
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
      }
      .pw-title {
        font-family: inherit;
        font-size: 28px; font-weight: 600; line-height: 1.12;
        letter-spacing: -0.022em;
        color: #1a1a1c;
        margin: 0;
      }
      .pw-tagline {
        font-size: 15px; line-height: 1.45; font-weight: 400;
        color: rgba(0,0,0,0.62);
        margin: 0;
        max-width: 340px;
      }

      .pw-features {
        list-style: none;
        margin: 0; padding: 0;
        display: flex; flex-direction: column;
        gap: 10px;
      }
      .pw-features li {
        display: flex; align-items: center; gap: 10px;
        font-size: 14.5px; font-weight: 500;
        color: rgba(0,0,0,0.78);
        line-height: 1.35;
      }
      .pw-features li svg {
        flex-shrink: 0;
        color: #5b4af0;
      }

      .pw-plans {
        display: flex; flex-direction: column; gap: 10px;
        margin-top: 4px;
      }
      .pw-plan {
        appearance: none; border: none; cursor: pointer;
        position: relative;
        text-align: left;
        padding: 18px 20px;
        border-radius: 18px;
        background: #1a1a1c;
        color: #fafaf6;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "name  price"
          "equiv price";
        column-gap: 14px;
        row-gap: 2px;
        align-items: baseline;
        box-shadow:
          0 1px 0 rgba(255,255,255,0.06) inset,
          0 12px 28px -10px rgba(0,0,0,0.35);
        transition: transform .18s cubic-bezier(.2,.8,.2,1),
                    box-shadow .25s ease;
        font-family: inherit;
      }
      .pw-plan:hover {
        box-shadow:
          0 1px 0 rgba(255,255,255,0.06) inset,
          0 16px 32px -10px rgba(0,0,0,0.40);
      }
      .pw-plan:active { transform: scale(0.985); }

      .pw-plan.pw-secondary {
        background: rgba(0,0,0,0.04);
        color: #1a1a1c;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10);
        grid-template-areas:
          "name  price"
          "name  price";
      }
      .pw-plan.pw-secondary:hover {
        background: rgba(0,0,0,0.06);
      }

      .pw-plan-name {
        grid-area: name;
        font-size: 17px; font-weight: 600;
        letter-spacing: -0.01em;
        display: inline-flex; align-items: center; gap: 8px;
        flex-wrap: wrap;
      }
      .pw-plan-badge {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 6px;
        background: #5b4af0;
        color: #fff;
        font-size: 9.5px; font-weight: 700; letter-spacing: 0.10em;
        line-height: 1.2;
        vertical-align: middle;
      }
      .pw-plan-price {
        grid-area: price;
        font-size: 22px; font-weight: 600;
        letter-spacing: -0.015em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .pw-plan-period {
        font-size: 13px; font-weight: 500;
        opacity: 0.65;
        margin-left: 1px;
      }
      .pw-plan-equiv {
        grid-area: equiv;
        font-size: 12px; font-weight: 500;
        opacity: 0.55;
      }

      .pw-fineprint {
        text-align: center;
        font-size: 12px; font-weight: 500;
        color: rgba(0,0,0,0.42);
        margin: 4px 0 0;
      }

      .pw-code-btn {
        appearance: none; border: none; cursor: pointer; background: transparent;
        align-self: center;
        margin-top: 12px;
        padding: 6px 4px;
        font-family: inherit;
        font-size: 14px; font-weight: 500;
        color: rgba(0,0,0,0.55);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: rgba(0,0,0,0.20);
        transition: color .2s ease;
      }
      .pw-code-btn:hover { color: rgba(0,0,0,0.75); }

      .pw-code-row {
        position: relative;
        display: none;
        align-items: center;
        margin-top: 4px;
        border-radius: 14px;
        background: rgba(0,0,0,0.04);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
        transition: box-shadow .2s ease;
      }
      .pw-code-row.show { display: flex; }
      .pw-code-row:focus-within {
        box-shadow: inset 0 0 0 2px #5b4af0;
      }
      #pwCodeInput {
        flex: 1;
        appearance: none; border: none; outline: none;
        background: transparent;
        padding: 14px 4px 14px 16px;
        font-family: inherit;
        font-size: 16px; font-weight: 500;
        color: #1a1a1c;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      #pwCodeInput::placeholder {
        color: rgba(0,0,0,0.32);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 400;
      }
      #pwCodeInput.shake {
        animation: snNudge .4s cubic-bezier(.36,.07,.19,.97);
      }
      .pw-code-submit {
        appearance: none; border: none; cursor: pointer;
        width: 36px; height: 36px; margin-right: 6px;
        border-radius: 10px;
        background: #1a1a1c; color: #fff;
        display: flex; align-items: center; justify-content: center;
        transition: transform .18s cubic-bezier(.2,.8,.2,1);
      }
      .pw-code-submit:active { transform: scale(0.92); }
      .pw-code-error {
        position: absolute;
        bottom: -22px; left: 4px;
        font-size: 12px;
        color: #c2410c;
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main id="app"></main>

    <script>

      // -------- Viewport keyboard fix --------
      // Mobile browsers report 100vh as the full screen, not what's actually visible
      // when the keyboard is open. We use visualViewport when available so the
      // composer stays glued to the visible bottom and the question stays visible.
      let _initialVH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      function syncViewport() {
        const vv = window.visualViewport;
        const h = vv ? vv.height : window.innerHeight;
        const fullH = vv ? (vv.offsetTop + vv.height) : window.innerHeight;
        document.documentElement.style.setProperty("--vh", h + "px");
        // --kb-gap: how much space the keyboard occupies. Screens use this as
        // padding-bottom so their BACKGROUND fills the full area (no white gap)
        // while CONTENT sits above the keyboard.
        const kbGap = Math.max(0, _initialVH - h);
        document.documentElement.style.setProperty("--kb-gap", kbGap + "px");
        const root = document.getElementById("app");
        if (root) {
          const kbOpen = h < _initialVH * 0.75;
          root.classList.toggle("keyboard-open", kbOpen);
        }
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncViewport);
        window.visualViewport.addEventListener("scroll", syncViewport);
      }
      window.addEventListener("resize", syncViewport);
      window.addEventListener("orientationchange", syncViewport);
      // Re-capture initial viewport height on orientation change so keyboard
      // detection threshold stays correct after rotation.
      window.addEventListener("orientationchange", () => {
        setTimeout(() => {

        }, 300);

      // When an input/textarea is focused, we poll viewport height briefly to
      // catch the keyboard animation. This is belt-and-suspenders on top of the
      // visualViewport listener above.
      (function installKeyboardFallback() {
        let kbPollId = null;
        function pollKeyboard(duration) {
          if (kbPollId) clearInterval(kbPollId);
          const end = Date.now() + duration;
          kbPollId = setInterval(() => {
            syncViewport();
            if (Date.now() > end) { clearInterval(kbPollId); kbPollId = null; }
          }, 60);

          if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {

      function requestFullscreenOnce() {

            });

        }

      // ============ PARTICLE SYSTEM ============
      let particles = [];

      function initParticles(canvasId) {
        particleCanvas = document.getElementById(canvasId);
        if (!particleCanvas) return;
        particleCtx = particleCanvas.getContext("2d");
        resizeParticleCanvas();
        window.addEventListener("resize", resizeParticleCanvas);
        particles = [];
        animateParticles();
      }

      function resizeParticleCanvas() {
        if (!particleCanvas) return;
        const dp = window.devicePixelRatio || 1;
        const W = window.innerWidth;
        const H = window.innerHeight;
        particleCanvas.width = W * dp;
        particleCanvas.height = H * dp;
        particleCanvas.style.width = W + "px";
        particleCanvas.style.height = H + "px";
        particleCtx.setTransform(dp, 0, 0, dp, 0, 0);
      }

      function spawnParticles(x, y) {
        const n = 40 + Math.floor(Math.random() * 20);
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const isCore = i < 15;
          const sp = isCore
            ? 0.005 + Math.random() * 0.015
            : 0.08 + Math.random() * 0.3;
          particles.push({
            x: x + (Math.random() - 0.5) * (isCore ? 8 : 0.45),
            y: y + (Math.random() - 0.5) * (isCore ? 8 : 0.45),
            life: 1,
            decay: isCore
              ? 0.00002 + Math.random() * 0.00004
              : 0.00004 + Math.random() * 0.0001,
            size: isCore
              ? 3.5 + Math.random() * 2.5
              : 2.5 + Math.random() * 3.5,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - (isCore ? 0.001 : 0.008),
            l: isCore ? 65 + Math.random() * 15 : 55 + Math.random() * 15,
            h: 200 + Math.random() * 20,
            pp: Math.random() * Math.PI * 2,
            t: 0,
            isCore,
          });
        }
      }

      function animateParticles() {
        if (!particleCtx) return;
        const W = window.innerWidth;
        const H = window.innerHeight;
        particleCtx.globalAlpha = 1;
        particleCtx.fillStyle = "#000";
        particleCtx.fillRect(0, 0, W, H);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.t++;
          p.life -= p.decay;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          const drift = p.isCore ? 0.05 : 0.15 + p.life * 0.85;
          p.x += p.vx * drift;
          p.y += p.vy * drift;
          const pulse = 0.65 + 0.35 * Math.sin(p.t * 0.008 + p.pp);
          const a = p.life * pulse;
          const sz = p.size * (1 + Math.random() * 0.3);
          particleCtx.globalAlpha = a * 0.95;
          particleCtx.fillStyle =
            "hsla(" + p.h + ",40%," + p.l + "%," + a + ")";
          particleCtx.beginPath();
          particleCtx.arc(p.x, p.y, sz, 0, Math.PI * 2);
          particleCtx.fill();
        }
        if (particles.length > 3000)
          particles.splice(0, particles.length - 3000);
        particleAnimId = requestAnimationFrame(animateParticles);
      }

      function stopParticles() {
        if (particleAnimId) {
          cancelAnimationFrame(particleAnimId);
          particleAnimId = null;
        }
        window.removeEventListener("resize", resizeParticleCanvas);
        particleCanvas = null;
        particleCtx = null;
        particles = [];
      }

              .then(data => {
                const city = data.address?.city || data.address?.town || data.address?.village || '';
                const cc = data.address?.country_code || '';
                let region = '';
                if (cc === 'us') {
                  // US state abbreviation lookup

      function introCharDelay(ch, prev) {
        if (prev === "." || prev === "!" || prev === "?") return 180;
        if (prev === ",") return 90;
        if (ch === " ") return 14;
        return 14 + Math.random() * 14;
      }
      function introSetPhase(note, noteStage, phase) {
        note.className = "intro-note " + phase;
        noteStage.setAttribute("data-phase", phase);
      }
      function introRenderTyped(body, n) {
        body.textContent = INTRO_TEXT.slice(0, n);
        const caret = document.createElement("span");
        caret.className = "intro-caret";
        body.appendChild(caret);
      }
      function introSleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      // Epoch-guarded loop: each call to startIntroAnim/stopIntroAnim
      // bumps the epoch, so any in-flight loop sees its captured epoch
      // is stale on the next sleep boundary and exits cleanly. Prevents
      // overlapping loops if the user toggles screens quickly.
      async function runIntroLoop(epoch) {
        const note = document.getElementById("introNote");
        const noteStage = document.getElementById("introNoteStage");
        const body = document.getElementById("introNoteBody");
        if (!note || !noteStage || !body) return;

        while (introAnimEpoch === epoch) {
          introSetPhase(note, noteStage, "empty");
          introRenderTyped(body, 0);
          await introSleep(900);
          if (introAnimEpoch !== epoch) return;

          introSetPhase(note, noteStage, "typing");
          let prev = "";
          for (let i = 1; i <= INTRO_TEXT.length; i++) {
            if (introAnimEpoch !== epoch) return;
            introRenderTyped(body, i);
            const ch = INTRO_TEXT[i - 1];
            await introSleep(introCharDelay(ch, prev));
            prev = ch;
          }

          if (introAnimEpoch !== epoch) return;
          introSetPhase(note, noteStage, "idle");
          await introSleep(900);
          if (introAnimEpoch !== epoch) return;

          introSetPhase(note, noteStage, "progress");
          await introSleep(1500);
          if (introAnimEpoch !== epoch) return;

          introSetPhase(note, noteStage, "ready");
          await introSleep(1700);
          if (introAnimEpoch !== epoch) return;

          introSetPhase(note, noteStage, "playing");
          await introSleep(3500);
          if (introAnimEpoch !== epoch) return;

          await introSleep(500);
        }
      }

      function startIntroAnim() {
        const epoch = ++introAnimEpoch;
        setTimeout(() => runIntroLoop(epoch), 800);
      }
      function stopIntroAnim() {
        introAnimEpoch++;
      }

      function snEnsureAudio() {
        if (snActx) return snActx;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          snActx = new AC();
        } catch (e) {
          return null;
        }
        return snActx;
      }
      function snBp(vol) {
        if (vol === undefined) vol = 0.05;
        const a = snEnsureAudio();
        if (!a) return;
        if (a.state === "suspended") a.resume().catch(() => {});
        const t0 = a.currentTime;
        const dur = 0.055;
        const buf = a.createBuffer(
          1,
          Math.max(1, Math.ceil(a.sampleRate * dur)),
          a.sampleRate,
        );
        const ch = buf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        const src = a.createBufferSource();
        src.buffer = buf;
        const bpFilter = a.createBiquadFilter();
        bpFilter.type = "bandpass";
        bpFilter.frequency.value = 1250 + Math.random() * 280;
        bpFilter.Q.value = 5.5;
        const hp = a.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 600;
        hp.Q.value = 0.7;
        const g = a.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(hp);
        hp.connect(bpFilter);
        bpFilter.connect(g);
        g.connect(a.destination);
        src.start(t0);
        src.stop(t0 + dur + 0.01);

      function snBtnContent(state) {

      }
      function snPillContent(state) {
        if (state === "progress") return `<span class="sn-dot"></span>RENDERING`;
        if (state === "ready") return `<span class="sn-dot"></span>READY · 0:12`;
        return "";

      function snBuildCard(note) {
        const el = document.createElement("div");
        el.className = "sn-card " + note.state;
        el.dataset.id = note.id;
        el.innerHTML = `
          <div class="sn-top-row">
            <div class="sn-meta">
              <div class="sn-when"></div>

            </div>

        return el;
      }

      function snFillCard(el, note, editable) {
        const d = new Date(note.when);
        const newClass = "sn-card " + note.state + (note._shake ? " shake" : "");
        if (el.className !== newClass) el.className = newClass;

        const whenEl = el.querySelector(".sn-when");
        const whenText = `${snFmtDate(d)} · ${snFmtTime(d)}`;
        if (whenEl.textContent !== whenText) whenEl.textContent = whenText;
        const placeEl = el.querySelector(".sn-place");
        if (placeEl.textContent !== (note.place || "")) placeEl.textContent = note.place || "";

        const jb = el.querySelector(".sn-jolt-btn");
        const wb = el.querySelector(".sn-watched-btn");
        const sb = el.querySelector(".sn-share-btn");
        const pillEl = el.querySelector(".sn-pill");

        if (note.state === "progress") {
          // Currently being generated
          jb.style.display = "";
          const newBtn = snBtnContent("progress");
          if (jb.innerHTML !== newBtn) jb.innerHTML = newBtn;
          jb.disabled = true;
          wb.style.display = "none";
          pillEl.style.display = "";
        } else if (note.session_id) {
          // Has generated audio - show Watched
          jb.style.display = "none";
          jb.disabled = true;
          wb.style.display = "";
          wb.disabled = false;
          pillEl.style.display = "none";
          const newWb = SN_ICON.bolt + " WATCHED";
          if (wb.innerHTML !== newWb) wb.innerHTML = newWb;
        } else {
          // No session_id, not in progress - show Jolt
          jb.style.display = "";
          const newBtn = SN_ICON.bolt + " JOLT";
          if (jb.innerHTML !== newBtn) jb.innerHTML = newBtn;
          jb.disabled = false;
          wb.style.display = "none";
          pillEl.style.display = "";
        }

        // Button clicks are handled by the delegated click handler in
        // snInstallListenersOnce() which matches data-action="sn-jolt" and
        // data-action="sn-share", finds the parent .sn-card, and calls
        // snJoltAt / snOpenShareSheet.  No direct onclick/addEventListener
        // needed here -- keeping it delegated avoids double-fire and
        // stopPropagation conflicts on mobile.

        const newPill = snPillContent(note.state);
        if (pillEl.innerHTML !== newPill) pillEl.innerHTML = newPill;

        const ta = el.querySelector("textarea");
        const txt = el.querySelector(".sn-text");
        if (editable) {
          if (ta.style.display === "none") ta.style.display = "";
          if (txt.style.display !== "none") txt.style.display = "none";
          if (document.activeElement !== ta && ta.value !== note.text) {
            ta.value = note.text;
          }
        } else {
          if (ta.style.display !== "none") ta.style.display = "none";
          if (txt.style.display === "none") txt.style.display = "";
          const wantText = note.text || "(empty)";
          if (txt.textContent !== wantText) txt.textContent = wantText;
          const wantPlaceholder = !note.text;
          if (wantPlaceholder !== txt.classList.contains("sn-placeholder")) {
            txt.classList.toggle("sn-placeholder", wantPlaceholder);
          }
        }
      }

      // ----- transform math (verbatim from mockup) -----
      function snTransformFor(off, drag) {
        const effective = off - drag;
        let ty, scale, opacity, blur, z;
        if (effective >= 0) {
          ty = effective * 32;
          scale = Math.max(0.84, 1 - effective * 0.06);
          opacity = Math.max(0, 1 - effective * 0.20);
          blur = effective > 0.7 ? Math.min(2.5, (effective - 0.7) * 1.5) : 0;
          z = 100 - Math.round(effective * 10);
        } else {
          const dir = drag > 0 ? -1 : +1;
          const t = -effective;
          ty = dir * t * 140;
          scale = Math.max(0.86, 1 - t * 0.10);
          opacity = Math.max(0, 1 - t * 1.4);
          blur = t > 0.25 ? Math.min(3.5, (t - 0.25) * 2.4) : 0;
          z = 200 + Math.round(t * 10);
        }
        return { ty, scale, opacity, blur, z };
      }

      function snRenderStack() {
        const stack = document.getElementById("snStack");
        if (!stack) return;
        const center = snDragOffset;
        const winLo = Math.floor(center - 1.2);
        const winHi = Math.ceil(center + 3.2);

        const visibleIds = new Set();
        const items = [];
        for (let off = winLo; off <= winHi; off++) {
          const i = snPos + off;
          if (i < 0 || i >= snNotes.length) continue;
          const note = snNotes[i];
          visibleIds.add(note.id);
          items.push({ note, idx: i, off });
        }

        for (const [nid, el] of snCardEls) {
          if (!visibleIds.has(nid)) {
            el.remove();
            snCardEls.delete(nid);
          }
        }

        items.forEach(({ note, idx, off }) => {
          let el = snCardEls.get(note.id);
          if (!el) {
            el = snBuildCard(note);
            snCardEls.set(note.id, el);
          }
          if (el.parentNode !== stack) stack.appendChild(el);

          const editable =
            off === 0 && snDragOffset === 0 && !snTransitioning;
          snFillCard(el, note, editable);

          const { ty, scale, opacity, blur, z } = snTransformFor(off, snDragOffset);
          el.style.transform = `translate3d(0, ${ty}px, 0) scale(${scale})`;
          el.style.opacity = opacity;
          el.style.filter = blur ? `blur(${blur}px)` : "none";
          el.style.zIndex = z;
          el.style.pointerEvents =
            Math.abs(off - snDragOffset) > 2.5 ? "none" : "auto";

          el.onclick = (e) => {
            if (e.target.closest("[data-action]")) return;
            if (off > 0 && !snTransitioning) {
              snTransitionTo(idx, +1);
            }
          };

          // Button clicks are handled by the delegated click handler in
          // snInstallListenersOnce(). No direct onclick handlers here.

          const ta = el.querySelector("textarea");
          ta.oninput = () => {
            if (off === 0 && idx < snNotes.length) {
              snNotes[idx].text = ta.value;
              snNotes[idx].when = new Date().toISOString();
              const d2 = new Date(snNotes[idx].when);
              el.querySelector(".sn-when").textContent =
                `${snFmtDate(d2)} · ${snFmtTime(d2)}`;
              snScheduleSaveText(snNotes[idx]);
            }
          };
          ta.onblur = () => {
            if (off === 0 && idx < snNotes.length) snFlushSaveText(snNotes[idx]);
          };
        });
      }

      // ----- text-save debounce (backend) -----
      const snSaveTimers = new Map();
      function snScheduleSaveText(note) {
        if (snSaveTimers.has(note.id)) clearTimeout(snSaveTimers.get(note.id));
        snSaveTimers.set(
          note.id,
          setTimeout(() => snFlushSaveText(note), 800),
        );
      }
      async function snFlushSaveText(note) {
        if (snSaveTimers.has(note.id)) {
          clearTimeout(snSaveTimers.get(note.id));
          snSaveTimers.delete(note.id);
        }
        // Skip backend write for client-only notes (locally-created ones get
        // a real id once /api/notes responds).
        if (typeof note.id !== "number") return;
        // Skip if session was cleared (prevents 401 cascade from debounce timers)
        if (!state.token) return;
        try {
          await api(`/api/notes/${note.id}`, {
            method: "PUT",
            body: JSON.stringify({ text: note.text || "" }),
          });
        } catch (e) {
          // api() handles 401 (clears token, redirects to splash).
          // Other errors are transient -- user is still typing, retry next debounce.
        }
      }

      // ----- animation driver -----
      function snAnimateTo(targetDrag, ms, onFinish) {
        if (snActiveAnimation) snActiveAnimation.cancel();
        const start = performance.now();
        const from = snDragOffset;
        const ease = (t) => 1 - Math.pow(1 - t, 3);
        let cancelled = false;
        let lastFloor = Math.floor(Math.abs(from));
        let finished = false;

        function step(now) {
          if (cancelled || finished) return;
          const t = Math.min(1, (now - start) / ms);
          const next = from + (targetDrag - from) * ease(t);
          const floorNow = Math.floor(Math.abs(next));
          if (floorNow > lastFloor) {
            snBp(0.05);
            lastFloor = floorNow;
          }
          snDragOffset = next;
          snRenderStack();
          if (t < 1) requestAnimationFrame(step);
          else {
            finished = true;
            snActiveAnimation = null;
            onFinish && onFinish();
          }
        }
        snActiveAnimation = {
          cancel() {
            cancelled = true;
            snActiveAnimation = null;
          },
        };
        requestAnimationFrame(step);
        // Safety: if animation hasn't completed after 2x the expected duration
        // (e.g. tab was backgrounded), force completion.
        setTimeout(() => {
          if (!cancelled && !finished) {
            finished = true;
            snDragOffset = targetDrag;
            snActiveAnimation = null;
            snRenderStack();
            onFinish && onFinish();
          }
        }, ms * 2 + 100);
        return snActiveAnimation;
      }

      function snCommitSteps(steps) {
        if (snTransitioning) return;
        if (steps === 0) {
          snSnapBack();
          return;
        }
        snTransitioning = true;
        const absSteps = Math.abs(steps);
        const ms = Math.min(620, 220 + absSteps * 110);
        snAnimateTo(steps, ms, () => {
          snPos = Math.round(snPos + steps);
          // Clamp to valid range
          snPos = Math.max(0, Math.min(snNotes.length - 1, snPos));
          snDragOffset = 0;
          snTransitioning = false;
          snRenderStack();
        });
      }

      function snTransitionTo(nextPos, dir) {
        nextPos = Math.max(0, Math.min(snNotes.length - 1, nextPos));
        const steps = nextPos - snPos;
        if (steps === 0) return;
        snCommitSteps(steps);
      }

      function snSnapBack() {
        if (Math.abs(snDragOffset) < 0.001) {
          snDragOffset = 0;
          snRenderStack();
          return;
        }
        snAnimateTo(0, 220, () => {
          snDragOffset = 0;
          snRenderStack();
        });
      }

      // ----- jolt (REAL BACKEND) -----
      async function snJoltAt(idx) {
        const n = snNotes[idx];
        if (!n) return;
        if (n.state === "progress") return;

        // Note with existing stimulus → play audio
        if (n.session_id) {
          snBp(0.07);
          snOpenModal(n.id);
          return;
        }

        // No session_id, empty text → ignore
        if (!(n.text || "").trim()) return;

        // No session_id, has text → run jolt generation → chills screen
        snBp(0.07);
        await snTriggerJoltGeneration(n);
      }

      // Run the full jolt + generate + poll cycle for a single note.
      // Used by both snJoltAt (initial click) and post-paywall unlock.
      // No state-machine guards here — the caller is responsible for
      // ensuring the note is in a state where this should run.
      async function snTriggerJoltGeneration(n) {
        const prevState = n.state;
        n.state = "progress";
        n._shake = true;
        snRenderStack();
        setTimeout(() => {
          n._shake = false;
          snRenderStack();
        }, 620);

        // Make sure latest text is saved before triggering.
        await snFlushSaveText(n);

        try {
          const joltRes = await api(`/api/notes/${n.id}/jolt`, { method: "POST" });
          if (joltRes.status === "blocked") {
            // Subscription required — revert state and open paywall.
            n.state = prevState;
            snRenderStack();
            snOpenPaywall(n.id);
            return;
          }
        } catch (e) {
          n.state = prevState;
          snRenderStack();
          alert("Could not start jolt: " + e.message);
          return;
        }

        // Kick off generation with the note text as q1.
        let jobId;
        try {
          const genRes = await api("/api/demo/generate", {
            method: "POST",
            body: JSON.stringify({
              q1_low_voice: n.text || "",
              q2_chills: "",
              q3_first_call: "",
              q4_unseen: "",
              note_id: n.id,
              place: state.userPlace,
            }),
          });
          jobId = genRes.job_id;
        } catch (e) {
          n.state = prevState;
          snRenderStack();
          alert("Could not start generation: " + e.message);
          return;
        }

        // Poll status until done, then transition to chills screen.
        const poll = setInterval(async () => {
          try {
            const st = await api(`/api/demo/generate/status/${jobId}`);
            if (st.stage === "done") {
              clearInterval(poll);
              n.state = "ready";
              n.session_id = st.session_id;
              n.audio_url = st.audio_url;
              snBp(0.05);

              // Transition to chills screen (stimulus) for note jolt
              state.noteJoltMode = true;
              state.joltNoteId = n.id;
              state.joltSessionId = st.session_id;
              state.sessionId = st.session_id;
              state.audioUrl = st.audio_url;
              state.chillsCount = 0;
              state.chillsTimestamps = [];
              state.screen = "stimulus";
              render();
            } else if (st.stage === "error") {
              clearInterval(poll);
              n.state = prevState;
              snRenderStack();
              alert("Generation error: " + (st.error || "Unknown"));
            }
          } catch (e) {
            /* swallow transient errors; loop continues */
          }
        }, 2500);
      }

      // ----- modal (audio playback) -----
      let snModalNoteId = null;
      let snModalAudio = null;
      function snOpenModal(noteId) {
        snModalNoteId = noteId;
        const modal = document.getElementById("snModal");
        if (modal) modal.classList.add("show");
        const n = snNotes.find((x) => x.id === noteId);
        if (n && n.audio_url) {
          acquireWakeLock();
          setupMediaSession("Your Jolt");
          snModalAudio = new Audio(n.audio_url);
          snModalAudio.play().catch((err) => {
            console.warn("[Modal] Audio play failed:", err);
            snShowToast("Audio expired -- jolt this note again");
            snCloseModal();
          });
          snModalAudio.onerror = () => {
            console.warn("[Modal] Audio load error for", n.audio_url);
            snShowToast("Audio expired -- jolt this note again");
            snCloseModal();
          };
          snModalAudio.onended = () => snCloseModal();
        } else {
          // No audio URL - show feedback and close
          snShowToast("No audio available -- jolt this note to generate");
          setTimeout(() => snCloseModal(), 300);
        }
      }
      async function snCloseModal() {
        const modal = document.getElementById("snModal");
        if (modal) modal.classList.remove("show");
        if (snModalAudio) {
          try { snModalAudio.pause(); } catch (_) {}
          snModalAudio = null;
        }
        releaseWakeLock();
        if (snModalNoteId) {
          const n = snNotes.find((x) => x.id === snModalNoteId);
          if (n && n.state === "ready") {
            n.state = "watched";
            snRenderStack();
            snBp(0.05);
            try {
              await api(`/api/notes/${n.id}/state`, {
                method: "PUT",
                body: JSON.stringify({ state: "watched" }),
              });
            } catch (e) {
              /* ignore */
            }
          }
        }
        snModalNoteId = null;
      }

      // ----- share sheet + toast -----
      let snShareSheetNote = null;
      let snToastTimer = null;
      function snShowToast(msg) {
        const toast = document.getElementById("snToast");
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add("show");
        if (snToastTimer) clearTimeout(snToastTimer);
        snToastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }
      function snOpenShareSheet(note) {
        snShareSheetNote = note;
        snBp(0.05);

        // Share the Jolt audio file if available
        if (note && note.audio_url && navigator.share) {
          fetch(note.audio_url)
            .then(r => {
              if (!r.ok) throw new Error("Audio not found");
              return r.blob();
            })
            .then(blob => {
              const file = new File([blob], "jolt.mp3", { type: "audio/mpeg" });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                  title: "My Jolt",
                  files: [file],
                }).catch(() => {});
              } else {
                // Fallback: download the audio
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "jolt.mp3";
                a.click();
                URL.revokeObjectURL(a.href);
                snShowToast("Audio downloaded");
              }
            })
            .catch(() => {
              snShowToast("Could not load audio");
            });
          return;
        }

        // Fallback for notes without audio
        const text = note ? (note.text || "") : "";
        const shareData = {
          title: "A jolt from my stack",
          text: text,
          url: window.location.origin,
        };
        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else {
          const ss = document.getElementById("snShareSheet");
          if (ss) ss.classList.add("show");
        }
      }
      function snCloseShareSheet() {
        const ss = document.getElementById("snShareSheet");
        if (ss) ss.classList.remove("show");
        setTimeout(() => {
          snShareSheetNote = null;
        }, 350);
      }

      // ----- new blank note (backend create) -----
      function snWordCount(s) {
        return (s || "").trim().split(/\s+/).filter(Boolean).length;
      }
      function snCanCreateNewNote() {
        if (snNotes.length >= 20) return false;
        // Block only if already viewing a blank top note (don't stack empties)
        const top = snNotes[0];
        if (snPos === 0 && top && !(top.text || "").trim()) return false;
        return true;
      }
      function snNudgeNewBtn() {
        const btn = document.getElementById("snNewBtn");
        if (!btn) return;
        btn.classList.remove("nudge");
        void btn.offsetWidth;
        btn.classList.add("nudge");
      }
      async function snNewBlankNote() {
        // Safety: if snTransitioning got stuck (e.g. animation cancelled
        // without callback firing), reset it when no animation is running.
        if (snTransitioning && !snActiveAnimation) {
          snTransitioning = false;
        }
        if (snTransitioning) return;
        if (!snCanCreateNewNote()) {
          snNudgeNewBtn();
          // If blocked because top note is blank, scroll to it and focus
          const top = snNotes[0];
          if (top && !(top.text || "").trim()) {
            if (snPos !== 0) {
              snTransitionTo(0, -1);
              // Focus textarea after transition settles
              setTimeout(() => {
                const el = snCardEls.get(snNotes[0].id);
                const ta = el && el.querySelector("textarea");
                if (ta) ta.focus();
              }, 500);
            } else {
              const el = snCardEls.get(snNotes[0].id);
              const ta = el && el.querySelector("textarea");
              if (ta) ta.focus();
            }
            snShowToast("Write something here first");
          }
          return;
        }
        snTransitioning = true;
        snBp(0.05);

        // Optimistically prepend a temp note so the animation feels instant,
        // then patch its id once the backend responds.
        const tempId = "tmp_" + Math.random().toString(36).slice(2, 9);
        const tempNote = {
          id: tempId,
          text: "",
          when: new Date().toISOString(),
          place: state.userPlace,
          state: "idle",
        };
        snNotes.unshift(tempNote);
        snPos = 1;
        snDragOffset = 0;
        snRenderStack();
        requestAnimationFrame(() => {
          snAnimateTo(-1, 420, () => {
            snPos = 0;
            snDragOffset = 0;
            snTransitioning = false;
            snRenderStack();
            snCardEls.get(snNotes[0].id)?.querySelector("textarea")?.focus();
          });
        });

        // Real create
        try {
          const created = await api("/api/notes", {
            method: "POST",
            body: JSON.stringify({ text: "", place: state.userPlace }),
          });
          // Patch id on the temp note (DOM key migrates: rebuild map entry)
          const tmpEl = snCardEls.get(tempId);
          tempNote.id = created.id;
          tempNote.when = created.created_at || tempNote.when;
          tempNote.place = created.place;
          if (tmpEl) {
            tmpEl.dataset.id = created.id;
            snCardEls.delete(tempId);
            snCardEls.set(created.id, tmpEl);
          }
        } catch (e) {
          // Roll back optimistic insert.
          snNotes = snNotes.filter((n) => n.id !== tempId);
          snCardEls.get(tempId)?.remove();
          snCardEls.delete(tempId);
          snTransitioning = false;
          snRenderStack();
          alert("Could not create note: " + e.message);
        }
      }

      // ----- input drivers (wheel / touch / mouse / keyboard) -----
      let snTouchActive = false,
        snTouchStartY = 0,
        snTouchLastY = 0,
        snTouchStartTime = 0,
        snLastDragFloor = 0,
        snWheelLock = 0,
        snGestureStartedAsDrag = false,
        snGestureCardId = null;

      const SN_CARD_HEIGHT_PX = 180;

      function snInEditable(target) {
        if (!target) return false;
        // Let any textarea or input click pass through (skip drag handler)
        // so the browser can focus it directly. On non-focused cards the
        // textarea is hidden (display:none) so it won't receive clicks.
        if (target.tagName === "TEXTAREA" || target.tagName === "INPUT") return true;
        // Also skip if clicking inside a focused textarea's container
        if (target.closest && target.closest(".sn-body") &&
            document.activeElement &&
            document.activeElement.tagName === "TEXTAREA") return true;
        return false;
      }
      function snFindTappedCardId(target) {
        if (!target) return null;
        const cardEl = target.closest && target.closest(".sn-card");
        return cardEl ? cardEl.dataset.id : null;
      }
      function snIsInteractiveTarget(target) {
        if (!target || !target.closest) return false;
        return !!target.closest("button, [data-action]");
      }

      function snDragStart(y) {
        // If an animation is running (snap or transition), cancel it and
        // snap to the nearest integer position so the card never gets stuck.
        if (snActiveAnimation) {
          const nearestStep = Math.round(snDragOffset);
          snActiveAnimation.cancel();
          snPos = Math.max(0, Math.min(snNotes.length - 1, snPos + nearestStep));
          snDragOffset = 0;
          snRenderStack();
        }
        // Always clear transitioning flag on a new user gesture.  This covers
        // the edge case where cancel() set snActiveAnimation=null but the
        // onFinish callback (which resets snTransitioning) never fired.
        snTransitioning = false;
        snTouchActive = true;
        snTouchStartY = y;
        snTouchLastY = y;
        snTouchStartTime = performance.now();
        snLastDragFloor = Math.floor(Math.abs(snDragOffset));
        const sa = document.getElementById("snStackArea");
        if (sa) sa.classList.add("dragging");
        return true;
      }
      function snDragMove(y) {
        if (!snTouchActive) return;
        snTouchLastY = y;
        const dy = y - snTouchStartY;
        let raw = -dy / SN_CARD_HEIGHT_PX;

        const maxAdvance = snNotes.length - 1 - snPos;
        const maxRetreat = snPos;
        const newNotePossible = snPos === 0 && snCanCreateNewNote();

        if (raw > maxAdvance) {
          const over = raw - maxAdvance;
          raw = maxAdvance + over * 0.25;
        }
        if (raw < -maxRetreat) {
          const floor = newNotePossible ? -1 : -maxRetreat;
          if (raw < floor) raw = floor + (raw - floor) * 0.25;
        }

        snDragOffset = raw;

        const floorNow = Math.floor(Math.abs(snDragOffset));
        if (floorNow > snLastDragFloor) {
          snBp(0.05);
          snLastDragFloor = floorNow;
        } else if (floorNow < snLastDragFloor) {
          snBp(0.045);
          snLastDragFloor = floorNow;
        }

        snRenderStack();
      }
      function snDragEnd() {
        if (!snTouchActive) return;
        snTouchActive = false;
        const sa = document.getElementById("snStackArea");
        if (sa) sa.classList.remove("dragging");

        const elapsed = performance.now() - snTouchStartTime;
        const dy = snTouchLastY - snTouchStartY;
        const velocity = elapsed > 0 ? -dy / elapsed : 0;
        const drag = snDragOffset;

        // Velocity-based snap: project where the drag would land
        const FLICK_GAIN = 0.6;
        const projected = drag + velocity * FLICK_GAIN;

        // Round to nearest integer card position
        let target = Math.round(projected);

        // Dead zone: if barely moved, snap back
        if (Math.abs(projected) < 0.18 && Math.abs(velocity) < 0.3) target = 0;

        // Velocity flick override: fast swipe should always advance at least 1
        if (Math.abs(velocity) > 0.5 && target === 0) {
          target = velocity > 0 ? 1 : -1;
        }

        if (snPos === 0 && target < 0 && snCanCreateNewNote()) {
          snAnimateTo(0, 160, () => {
            snDragOffset = 0;
            snRenderStack();
            snNewBlankNote();
          });
          return;
        }

        const maxAdvance = snNotes.length - 1 - snPos;
        const maxRetreat = -snPos;
        target = Math.max(maxRetreat, Math.min(maxAdvance, target));

        if (target === 0) snSnapBack();
        else snCommitSteps(target);
      }

      // Install global listeners only once.
      function snInstallListenersOnce() {
        if (snStarted) return;
        snStarted = true;

        // Stack-area gestures (delegated by ID lookup at event time so they
        // survive re-renders).
        const stackAreaSel = "#snStackArea";

        document.addEventListener(
          "wheel",
          (e) => {
            if (state.screen !== "sticky-notes") return;
            const sa = document.querySelector(stackAreaSel);
            if (!sa || !sa.contains(e.target)) return;
            if (snInEditable(e.target)) return;
            if (snTransitioning) return;
            const t = Date.now();
            if (t - snWheelLock < 320) return;
            if (Math.abs(e.deltaY) < 12) return;
            snWheelLock = t;
            if (e.deltaY > 0) {
              if (snPos < snNotes.length - 1) snCommitSteps(+1);
            } else {
              if (snPos > 0) snCommitSteps(-1);
              else if (snPos === 0 && snCanCreateNewNote()) snNewBlankNote();
            }
          },
          { passive: true },
        );

        document.addEventListener(
          "touchstart",
          (e) => {
            if (state.screen !== "sticky-notes") return;
            const sa = document.querySelector(stackAreaSel);
            if (!sa || !sa.contains(e.target)) return;
            if (snInEditable(e.target)) return;
            if (snIsInteractiveTarget(e.target)) return;
            snGestureStartedAsDrag = false;
            snGestureCardId = snFindTappedCardId(e.target);
            snDragStart(e.touches[0].clientY);
          },
          { passive: true },
        );
        document.addEventListener(
          "touchmove",
          (e) => {
            if (state.screen !== "sticky-notes") return;
            if (!snTouchActive) return;
            const dy = Math.abs(e.touches[0].clientY - snTouchStartY);
            if (dy > 6) snGestureStartedAsDrag = true;
            snDragMove(e.touches[0].clientY);
          },
          { passive: true },
        );
        function handleTouchEnd() {
          if (state.screen !== "sticky-notes") return;
          const wasDrag = snGestureStartedAsDrag;
          const cardId = snGestureCardId;
          snDragEnd();
          if (!wasDrag && cardId) {
            const focusedNote = snNotes[snPos];
            if (focusedNote && String(focusedNote.id) === String(cardId)) {
              const el = snCardEls.get(focusedNote.id);
              const ta = el && el.querySelector("textarea");
              if (ta) setTimeout(() => ta.focus(), 0);
            }
          }
          snGestureCardId = null;
        }
        document.addEventListener("touchend", handleTouchEnd);
        document.addEventListener("touchcancel", handleTouchEnd);

        document.addEventListener("mousedown", (e) => {
          if (state.screen !== "sticky-notes") return;
          const sa = document.querySelector(stackAreaSel);
          if (!sa || !sa.contains(e.target)) return;
          if (snInEditable(e.target)) return;
          if (e.button !== 0) return;
          if (snIsInteractiveTarget(e.target)) return;
          // Mouse-only: clicking in the focused card's body area should focus
          // the textarea with native caret placement, not start a drag.
          // (Touch swiping is handled by the separate touchstart handler.)
          const bodyEl = e.target.closest && e.target.closest(".sn-body");
          if (bodyEl) {
            const cardEl = bodyEl.closest(".sn-card");
            const focusedNote = snNotes[snPos];
            if (cardEl && focusedNote &&
                String(cardEl.dataset.id) === String(focusedNote.id)) {
              const ta = bodyEl.querySelector("textarea");
              if (ta && ta.style.display !== "none") {
                // Focus textarea; don't start drag
                setTimeout(() => ta.focus(), 0);
                return;
              }
            }
          }
          snGestureStartedAsDrag = false;
          snGestureCardId = snFindTappedCardId(e.target);
          if (!snDragStart(e.clientY)) return;
          e.preventDefault();
          const onMove = (ev) => {
            const dy = Math.abs(ev.clientY - snTouchStartY);
            if (dy > 6) snGestureStartedAsDrag = true;
            snDragMove(ev.clientY);
          };
          const onUp = () => {
            const wasDrag = snGestureStartedAsDrag;
            const cardId = snGestureCardId;
            snDragEnd();
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
            if (!wasDrag && cardId) {
              const focusedNote = snNotes[snPos];
              if (focusedNote && String(focusedNote.id) === String(cardId)) {
                const el = snCardEls.get(focusedNote.id);
                const ta = el && el.querySelector("textarea");
                if (ta) ta.focus();
              }
            }
            snGestureCardId = null;
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        });

        document.addEventListener("keydown", (e) => {
          if (state.screen !== "sticky-notes") return;
          if (snInEditable(e.target)) return;
          if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
            if (snPos < snNotes.length - 1) {
              e.preventDefault();
              snCommitSteps(+1);
            }
          } else if (e.key === "ArrowUp" || e.key === "PageUp") {
            e.preventDefault();
            if (snPos > 0) snCommitSteps(-1);
            else if (snPos === 0 && snCanCreateNewNote()) snNewBlankNote();
          } else if (e.key === "Escape") {
            const modal = document.getElementById("snModal");
            const ss = document.getElementById("snShareSheet");
            const pw = document.getElementById("pwPaywall");
            if (modal && modal.classList.contains("show")) snCloseModal();
            else if (pw && pw.classList.contains("show")) snClosePaywall();
            else if (ss && ss.classList.contains("show")) snCloseShareSheet();
          }
        });

        // Delegated card button clicks (jolt + share)
        document.addEventListener("click", (e) => {
          if (state.screen !== "sticky-notes") return;
          const btn =
            e.target &&
            e.target.closest &&
            e.target.closest("button[data-action]");
          if (!btn) return;
          const action = btn.dataset.action;

          // Sticky-notes UI buttons
          if (action === "sn-new") {
            snNewBlankNote();
            return;
          }
          if (action === "sn-prompt-close") {
            state.promptDismissed = true;
            const bar = document.getElementById("snPromptBar");
            if (bar) bar.remove();
            return;
          }
          if (action === "sn-modal-back") {
            snCloseModal();
            return;
          }
          if (action === "sn-share-cancel") {
            snCloseShareSheet();
            return;
          }
          if (action === "sn-share-scrim") {
            snCloseShareSheet();
            return;
          }
          // Paywall
          if (action === "pw-close") {
            snClosePaywall();
            return;
          }
          if (action === "pw-yearly") {
            snPurchasePlan("yearly");
            return;
          }
          if (action === "pw-monthly") {
            snPurchasePlan("monthly");
            return;
          }
          if (action === "pw-code-toggle") {
            const row = document.getElementById("pwCodeRow");
            const input = document.getElementById("pwCodeInput");
            const err = document.getElementById("pwCodeError");
            if (err) err.textContent = "";
            if (row) {
              const showing = row.classList.toggle("show");
              if (showing && input) setTimeout(() => input.focus(), 200);
            }
            return;
          }
          if (action === "pw-code-submit") {
            snTryRedeem();
            return;
          }

          // Card-level
          const cardEl = btn.closest(".sn-card");
          if (cardEl) {
            const cardId = cardEl.dataset.id;
            const idx = snNotes.findIndex((n) => String(n.id) === String(cardId));
            if (idx < 0) return;
            e.stopPropagation();
            if (action === "sn-jolt") {
              snJoltAt(idx);
            } else if (action === "sn-share") {
              snOpenShareSheet(snNotes[idx]);
            }
            return;
          }

          // Share-option taps
          const opt = e.target.closest(".sn-share-option");
          if (opt) {
            (async () => {
              const optAction = opt.dataset.share;
              const note = snShareSheetNote;
              const text = note ? note.text || "(empty note)" : "";
              snBp(0.05);
              if (optAction === "copy") {
                try {
                  await navigator.clipboard.writeText(text);
                } catch (_) {
                  const ta = document.createElement("textarea");
                  ta.value = text;
                  document.body.appendChild(ta);
                  ta.select();
                  try { document.execCommand("copy"); } catch (__) {}
                  document.body.removeChild(ta);
                }
                snCloseShareSheet();
                snShowToast("Copied to clipboard");
              } else if (optAction === "messages") {
                if (navigator.share) {
                  try { await navigator.share({ text }); } catch (_) {}
                  snCloseShareSheet();
                } else {
                  window.location.href = "sms:?body=" + encodeURIComponent(text);
                  snCloseShareSheet();
                }
              } else if (optAction === "mail") {
                window.location.href =
                  "mailto:?subject=" +
                  encodeURIComponent("A jolt from my stack") +
                  "&body=" +
                  encodeURIComponent(text);
                snCloseShareSheet();
              } else if (optAction === "more") {
                if (navigator.share) {
                  try { await navigator.share({ text }); snCloseShareSheet(); }
                  catch (_) { snCloseShareSheet(); }
                } else {
                  snCloseShareSheet();
                  snShowToast("System share not available");
                }
              }
            })();
          }
        });
      }

      // ----- screen mount -----
      async function startStickyNotes() {
        // If user logged out and back in, the old snCardEls map might hold
        // stale DOM references. Clear them so cards are rebuilt fresh.
        if (snCardEls.size > 0) {
          snCardEls.clear();
        }

        snInstallListenersOnce();

        // Wire screen-local buttons that aren't card-scoped.
        const newBtn = document.getElementById("snNewBtn");
        if (newBtn) newBtn.dataset.action = "sn-new";
        const modalBack = document.getElementById("snModalBack");
        if (modalBack) modalBack.dataset.action = "sn-modal-back";
        const ssCancel = document.getElementById("snShareSheetCancel");
        if (ssCancel) ssCancel.dataset.action = "sn-share-cancel";
        const ssScrim = document.getElementById("snShareSheetScrim");
        if (ssScrim) {
          ssScrim.style.cursor = "pointer";
          ssScrim.addEventListener("click", snCloseShareSheet);
        }

        // Settings panel wiring
        const gearBtn = document.getElementById("snGearBtn");
        const settingsPanel = document.getElementById("snSettingsPanel");
        const settingsScrim = document.getElementById("snSettingsScrim");
        const notifRow = document.getElementById("snNotifRow");
        const notifToggle = document.getElementById("snNotifToggle");
        const signOutRow = document.getElementById("snSignOutRow");

        function openSettingsPanel() {
          if (settingsPanel) settingsPanel.classList.add("is-open");
          if (settingsScrim) settingsScrim.classList.add("is-open");
          if (gearBtn) gearBtn.classList.add("is-open");
        }
        function closeSettingsPanel() {
          if (settingsPanel) settingsPanel.classList.remove("is-open");
          if (settingsScrim) settingsScrim.classList.remove("is-open");
          if (gearBtn) gearBtn.classList.remove("is-open");
        }

        if (gearBtn) {
          gearBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (settingsPanel && settingsPanel.classList.contains("is-open")) closeSettingsPanel();
            else openSettingsPanel();
          });
        }
        if (settingsScrim) settingsScrim.addEventListener("click", closeSettingsPanel);

        // Initialize notification toggle state
        if (notifToggle && Notification.permission === "granted") {
          notifToggle.classList.add("on");
        }

        if (notifRow) {
          notifRow.addEventListener("click", async () => {
            if (!notifToggle) return;
            if (notifToggle.classList.contains("on")) {
              // Turn off: unsubscribe
              notifToggle.classList.remove("on");
              try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (sub) {
                  const keys = sub.toJSON().keys || {};
                  await api("/api/push/unsubscribe", {
                    method: "POST",
                    body: JSON.stringify({
                      endpoint: sub.endpoint,
                      p256dh: keys.p256dh || "",
                      auth: keys.auth || "",
                    }),
                  });
                  await sub.unsubscribe();
                }
              } catch(e) { /* silent */ }
            } else {
              // Turn on: request permission + subscribe
              const perm = await Notification.requestPermission();
              if (perm !== "granted") return;
              notifToggle.classList.add("on");
              try {
                const reg = await navigator.serviceWorker.ready;
                const vapidRes = await api("/api/push/vapid-key");
                if (vapidRes.vapid_public_key) {
                  const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: vapidRes.vapid_public_key,
                  });
                  const keys = sub.toJSON().keys || {};
                  await api("/api/push/subscribe", {
                    method: "POST",
                    body: JSON.stringify({
                      endpoint: sub.endpoint,
                      p256dh: keys.p256dh || "",
                      auth: keys.auth || "",
                    }),
                  });
                }
              } catch(e) {
                notifToggle.classList.remove("on");
              }
            }
          });
        }

        if (signOutRow) {
          signOutRow.addEventListener("click", () => {
            closeSettingsPanel();
            state.token = null;
            state.user = null;
            localStorage.removeItem("jolter_token");
            clearFlowState();
            state.screen = "splash";
            render();
          });
        }

        // Esc closes settings panel
        document.addEventListener("keydown", function snEscHandler(e) {
          if (e.key === "Escape") closeSettingsPanel();
        });

        // Paywall buttons
        const pwClose = document.getElementById("pwClose");
        if (pwClose) pwClose.dataset.action = "pw-close";
        const pwYearly = document.getElementById("pwYearly");
        if (pwYearly) pwYearly.dataset.action = "pw-yearly";
        const pwMonthly = document.getElementById("pwMonthly");
        if (pwMonthly) pwMonthly.dataset.action = "pw-monthly";
        const pwCodeBtn = document.getElementById("pwCodeBtn");
        if (pwCodeBtn) pwCodeBtn.dataset.action = "pw-code-toggle";
        const pwCodeSubmit = document.getElementById("pwCodeSubmit");
        if (pwCodeSubmit) pwCodeSubmit.dataset.action = "pw-code-submit";
        // Enter on the code input submits redeem
        const pwCodeInput = document.getElementById("pwCodeInput");
        if (pwCodeInput) {
          pwCodeInput.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") {
              ev.preventDefault();
              snTryRedeem();
            }
          });
        }

        // Hydrate notes from backend.
        await snLoadNotes();

        // Hide plus button when keyboard opens (textarea focused)
        const snNewBtnEl = document.getElementById("snNewBtn");
        if (snNewBtnEl && window.visualViewport) {
          let origHeight = window.visualViewport.height;
          window.visualViewport.addEventListener("resize", () => {
            if (state.screen !== "sticky-notes") return;
            const btn = document.getElementById("snNewBtn");
            const stackArea = document.getElementById("snStackArea");
            const promptBar = document.getElementById("snPromptBar");
            // Keyboard is open when viewport shrinks significantly
            const keyboardOpen = window.visualViewport.height < origHeight * 0.75;
            if (btn) btn.style.display = keyboardOpen ? "none" : "";
            // Push card to bottom when keyboard is open so textarea sits flush above keyboard
            if (stackArea) {
              stackArea.style.justifyContent = keyboardOpen ? "flex-end" : "center";
              stackArea.style.paddingBottom = keyboardOpen ? "8px" : "";
            }
            // Hide prompt bar when keyboard is open
            if (promptBar) promptBar.style.display = keyboardOpen ? "none" : "";
          });
        }
      }

      async function snLoadNotes() {
        try {
          const res = await api("/api/notes");
          // Map backend NoteResponse → mockup-shaped note. Mockup uses
          // `when` for the timestamp; backend gives `updated_at`/`created_at`.
          snNotes = (res.notes || []).map((n) => ({
            id: n.id,
            text: n.text || "",
            when: n.updated_at || n.created_at || new Date().toISOString(),
            place: n.place,
            state: n.state || "idle",
            session_id: n.session_id,
            audio_url: n.session_id
              ? `/api/demo/audio/${n.session_id}.mp3`
              : null,
            jolt_count: n.jolt_count || 0,
          }));
          // If the first note is a fresh blank, focus stays on it. Otherwise
          // we still land on index 0 (newest).
          snPos = 0;
          snDragOffset = 0;
          snCardEls.clear();
          const stack = document.getElementById("snStack");
          if (stack) stack.innerHTML = "";
          snRenderStack();
        } catch (e) {
          alert("Could not load your notes: " + e.message);
        }
      }

      // ============ PAYWALL ============
      // Verbatim from sticky-notes.html embedded paywall. Demo VALID_CODES
      // set is replaced with a real /api/subscription/redeem call. Plan
      // taps hit /api/subscription/purchase. On unlock, we close the
      // paywall and retrigger the jolt cycle on the originally-blocked note.
      let snPaywallNoteId = null;

      function snOpenPaywall(noteId) {
        snPaywallNoteId = noteId;
        // Reset code UI each open
        const row = document.getElementById("pwCodeRow");
        const input = document.getElementById("pwCodeInput");
        const err = document.getElementById("pwCodeError");
        if (row) row.classList.remove("show");
        if (input) input.value = "";
        if (err) {
          err.textContent = "";
          err.style.color = "";
        }
        const pw = document.getElementById("pwPaywall");
        if (pw) pw.classList.add("show");
      }

      function snClosePaywall() {
        const pw = document.getElementById("pwPaywall");
        if (pw) pw.classList.remove("show");
        snPaywallNoteId = null;
      }

      async function snTryRedeem() {
        const input = document.getElementById("pwCodeInput");
        const err = document.getElementById("pwCodeError");
        if (!input) return;
        const code = (input.value || "").trim().toUpperCase();
        if (!code) return;
        try {
          await api("/api/subscription/redeem", {
            method: "POST",
            body: JSON.stringify({ code }),
          });
          // Code accepted — mark unlocked locally and retrigger.
          if (state.user) state.user.hasSubscription = true;
          snBp(0.05);
          snAfterUnlock();
        } catch (e) {
          if (err) {
            err.style.color = "#c2410c";
            err.textContent = e.message || "That code didn’t work. Try another?";
          }
          input.classList.remove("shake");
          void input.offsetWidth;
          input.classList.add("shake");
        }
      }

      async function snPurchasePlan(plan) {
        try {
          await api("/api/subscription/purchase", {
            method: "POST",
            body: JSON.stringify({ plan }),
          });
          if (state.user) state.user.hasSubscription = true;
          snBp(0.05);
          snAfterUnlock();
        } catch (e) {
          alert("Purchase failed: " + (e.message || "Unknown"));
        }
      }

      // After successful redeem or purchase: close paywall, retrigger the
      // jolt cycle on the note that was blocked. The /jolt endpoint will
      // now pass since the user has an active subscription.
      function snAfterUnlock() {
        const id = snPaywallNoteId;
        snClosePaywall();
        if (id == null) return;
        const n = snNotes.find((x) => String(x.id) === String(id));
        if (!n) return;
        snTriggerJoltGeneration(n);
      }

            </div>
