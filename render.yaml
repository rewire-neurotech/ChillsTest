services:
  - type: web
    name: jolter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    customDomains:
      - name: app.rewire.bio
    disk:
      name: audio-storage
      mountPath: /data/audio
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FFMPEG_BIN
        value: /usr/bin/ffmpeg
      - key: FFPROBE_BIN
        value: /usr/bin/ffprobe
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OUT_DIR
        value: /data/audio
      - key: PUBLIC_BASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
